<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>面板方案对比 · 指标可视化与诊断流程</title>
<style>
:root{
  --paper:#f7f4ee; --paper-2:#f1ede4; --card:#fbf9f5;
  --ink:#1a1713; --ink-2:#5d564b; --ink-3:#8d8577;
  --line:#e2dccd; --line-2:#cfc7b4;
  --signal:#b3401f; --signal-soft:rgba(179,64,31,.10);
  --good:#2f6f4a; --warn:#8a6410; --bad:#a32b22; --mute:#7c7568;
  --serif:"Charter","Iowan Old Style","Songti SC",Georgia,serif;
  --sans:"Avenir Next","PingFang SC","Hiragino Sans GB","Helvetica Neue",sans-serif;
  --mono:"SF Mono",ui-monospace,Menlo,monospace;
}
html[data-theme=dark]{
  --paper:#14130f; --paper-2:#1a1814; --card:#1d1b16;
  --ink:#f2eee4; --ink-2:#b3ac9d; --ink-3:#7e776a;
  --line:#2b2822; --line-2:#3b372e;
  --signal:#e0703f; --signal-soft:rgba(224,112,63,.14);
  --good:#67b68c; --warn:#d6a44a; --bad:#e06a5e; --mute:#8b8477;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.55 var(--sans);
     -webkit-font-smoothing:antialiased;padding-bottom:80px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
h1,h2,h3{margin:0;font-weight:600}
.num{font-family:var(--serif);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.mono{font-family:var(--mono);font-size:.92em}
.hint{font-size:11.5px;color:var(--ink-3)}

/* ---- 顶部：方案切换 ---- */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--paper) 92%,transparent);
     backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .in{max-width:1360px;margin:0 auto;padding:12px 24px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.mark{font-family:var(--serif);font-size:17px}
.mark em{font-style:normal;color:var(--signal)}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:999px;padding:2px;gap:2px;background:var(--card)}
.seg button{font-size:12px;padding:3px 11px;border-radius:999px;color:var(--ink-3);white-space:nowrap}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--paper)}
.top .grow{flex:1}
.scheme-note{max-width:1360px;margin:0 auto;padding:10px 24px 0;font-size:12.5px;color:var(--ink-2)}
.scheme-note b{color:var(--ink)}
.stage{max-width:1360px;margin:0 auto;padding:14px 24px 0}

/* ---- 通用小块 ---- */
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex:0 0 auto}
.dot.ok{background:var(--good)}.dot.warn{background:var(--warn)}.dot.bad{background:var(--bad)}.dot.run{background:var(--signal);box-shadow:0 0 0 3px var(--signal-soft)}
.tag{display:inline-block;font-size:10px;letter-spacing:.05em;padding:1px 5px;border-radius:4px;border:1px solid currentColor;white-space:nowrap}
.tag.mute{color:var(--mute)}.tag.ok{color:var(--good)}.tag.warn{color:var(--warn)}.tag.bad{color:var(--bad)}.tag.sig{color:var(--signal)}
.bar{height:6px;background:var(--paper-2);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--signal);border-radius:3px}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:10px}
.kpi>div .k{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.kpi>div .v{font-family:var(--serif);font-size:21px;line-height:1.15}
.kpi>div .v small{font-family:var(--sans);font-size:10.5px;color:var(--ink-3);margin-left:3px}
section.blk{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
section.blk:first-child{border-top:0;margin-top:0;padding-top:0}
h2.sec{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-2);
       display:flex;align-items:center;gap:8px;margin-bottom:10px}
h2.sec::before{content:"";width:2px;height:11px;background:var(--signal);border-radius:1px}
h2.sec .right{margin-left:auto;display:flex;gap:6px;align-items:center}

/* ---- 会话行（列表/表/时间轴复用） ---- */
.run{display:grid;align-items:center;gap:10px;padding:8px 10px;border-radius:6px;cursor:pointer;font-size:12.5px}
.run:hover{background:var(--paper-2)}
.run[aria-current=true]{background:var(--signal-soft)}
.run .rid{font-family:var(--mono);font-size:11.5px;display:flex;gap:4px;min-width:0}
.run .rid-d{color:var(--ink-3);flex:0 0 auto}
.run .rid-t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.run .meta{color:var(--ink-3);font-size:10.5px;margin-top:1px}
.synthetic{opacity:.55;border-left:2px dotted var(--line-2)}

/* ---- 方案 A ---- */
.A{display:grid;grid-template-columns:300px 1fr;gap:22px;align-items:start}
.A .rail{border-right:1px solid var(--line);padding-right:16px;max-height:78vh;overflow:auto}
.A .grp{margin-bottom:12px}
.A .grph{display:flex;align-items:center;gap:7px;font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;
         color:var(--ink-3);padding:6px 0;cursor:pointer}
.A .grph .cnt{margin-left:auto;font-family:var(--mono);letter-spacing:0}
.A details summary{list-style:none;cursor:pointer}
.A details summary::-webkit-details-marker{display:none}

/* ---- 方案 B ---- */
.B table{width:100%;border-collapse:collapse}
.B th{text-align:left;font-weight:500;font-size:10px;letter-spacing:.1em;text-transform:uppercase;
      color:var(--ink-3);padding:0 8px 8px;border-bottom:1px solid var(--line-2);position:sticky;top:56px;background:var(--paper)}
.B td{padding:7px 8px;border-bottom:1px solid var(--line);font-size:12px;vertical-align:middle}
.B tbody tr{cursor:pointer}
.B tbody tr:hover td{background:var(--signal-soft)}
.B .rid{font-family:var(--mono);font-size:11.5px}
.B .c{text-align:right;font-family:var(--mono);font-size:11px}
.spark{display:flex;align-items:flex-end;gap:1px;height:14px}
.spark i{width:4px;background:var(--signal);opacity:.75;border-radius:1px}
.crumb{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.crumb button{font-size:12px;color:var(--ink-2);border:1px solid var(--line-2);border-radius:6px;padding:3px 9px}
.crumb button:hover{background:var(--paper-2)}

/* ---- 方案 C ---- */
.C{display:grid;grid-template-columns:1fr 330px;gap:26px;align-items:start}
.C .tl{position:relative;padding-left:18px}
.C .tl::before{content:"";position:absolute;left:4px;top:6px;bottom:6px;width:1px;background:var(--line-2)}
.C .beat{position:relative;margin-bottom:6px}
.C .beat::before{content:"";position:absolute;left:-18px;top:13px;width:9px;height:9px;border-radius:50%;
                 background:var(--paper);border:2px solid var(--line-2)}
.C .beat.on::before{border-color:var(--signal);background:var(--signal)}
.C .beat .run{border:1px solid transparent}
.C .beat .run[aria-current=true]{border-color:var(--line-2);background:var(--card)}
.C .open{margin:2px 0 12px 10px;border-left:2px solid var(--line-2);padding:10px 0 2px 16px}
.C .sticky{position:sticky;top:64px}
.C .runsplit{display:grid;grid-template-columns:1fr 96px;gap:8px;align-items:center}

/* ---- 方案 D ---- */
.D{display:grid;grid-template-columns:296px 1fr;gap:0}
.D .side{border-right:1px solid var(--line);padding:14px 16px 0 0;position:sticky;top:56px;max-height:calc(100vh - 64px);overflow:auto}
.D .main{padding-left:20px;display:grid;grid-template-columns:274px 1fr;gap:20px;align-items:start}
.D .list{max-height:calc(100vh - 150px);overflow:auto;padding-right:6px}

/* ---- 详情 ---- */
.concl{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);
       border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:10px}
.concl>div{background:var(--card);padding:10px 12px}
.concl .k{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-bottom:3px}
.concl .v{font-size:12.5px;line-height:1.35}
.lede{font-size:12.5px;color:var(--ink-2);line-height:1.6;margin:8px 0 18px;max-width:80ch}
.rail6{display:grid;grid-template-columns:repeat(6,1fr);margin:4px 0 2px}
.rail6 .nd{position:relative;padding:0 6px 0 0}
.rail6 .nd::before{content:"";position:absolute;left:0;right:0;top:10px;height:1px;background:var(--line-2)}
.rail6 .nd:first-child::before{left:10px}
.rail6 .nd:last-child::before{right:calc(100% - 10px)}
.rail6 .n{position:relative;z-index:1;width:21px;height:21px;border-radius:50%;display:grid;place-items:center;
          background:var(--card);border:1px solid var(--line-2);font-family:var(--serif);font-size:11.5px;color:var(--ink-2)}
.rail6 .has .n{background:var(--signal);border-color:var(--signal);color:#fff}
.rail6 .gap .n{border-style:dashed;color:var(--ink-3)}
.rail6 .nm{font-size:11px;margin-top:5px;color:var(--ink-2)}
.rail6 .nc{font-size:10px;color:var(--ink-3);font-family:var(--mono);margin-top:2px}
.wf{margin-top:14px}
.wfrow{display:grid;grid-template-columns:104px 1fr 132px;gap:12px;align-items:center;padding:4px 0}
.wfl{display:flex;gap:6px;align-items:baseline;font-size:12px;color:var(--ink-2)}
.wfn{font-size:13px;color:var(--ink)}
.wfb .ms{height:13px;background:var(--paper-2);border-radius:2px;overflow:hidden}
.wfb .ms i{display:block;height:100%;background:var(--signal)}
.wfb .tk{height:3px;background:var(--paper-2);border-radius:2px;overflow:hidden;margin-top:3px}
.wfb .tk i{display:block;height:100%;background:var(--ink-3);opacity:.5}
.wfv{text-align:right;font-family:var(--mono);font-size:11.5px}
.wfv span{display:block;color:var(--ink-3);font-size:10px}
.funnel{display:grid;gap:2px}
.funnel .fr{display:grid;grid-template-columns:74px 1fr 128px;gap:10px;align-items:center;font-size:11.5px}
.funnel .fb{height:20px;background:var(--signal);border-radius:3px;display:flex;align-items:center;
            justify-content:flex-end;padding-right:6px;color:#fff;font-family:var(--mono);font-size:10.5px;min-width:26px}
.funnel .fb.z{background:var(--line-2);color:var(--ink-2)}
.funnel .fn{color:var(--ink-3);font-size:10px;text-align:right}
.mlist .m{display:grid;grid-template-columns:1fr auto;gap:8px;padding:5px 0;border-bottom:1px solid var(--line);font-size:12px}
.mlist .m:last-child{border-bottom:0}
.mlist .mv{font-family:var(--mono);font-size:11px;color:var(--ink-3)}
.rank{width:100%;border-collapse:collapse}
.rank th{text-align:left;font-weight:500;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);padding:0 0 6px;border-bottom:1px solid var(--line-2)}
.rank td{padding:6px 0;border-bottom:1px solid var(--line);font-size:12px}
.rank tr:last-child td{border-bottom:0}
.rank .n{font-family:var(--mono);font-size:11px}
.rank .r{text-align:right;font-family:var(--serif);font-variant-numeric:tabular-nums}
.anchors{position:sticky;top:64px;font-size:11.5px;border-left:1px solid var(--line);padding-left:12px}
.anchors a{display:block;color:var(--ink-3);padding:3px 0;text-decoration:none}
.anchors a:hover{color:var(--signal)}
</style>
</head>

eek-V4 Pro 在 Atlas 800I A3 上 GPQA 评分明显偏低（同模型其他环境正常）：三个独立根因叠加——rope 转 float32、Dequantswigluquant/GMMswigluquant 的 clamp 缺陷（主因）、moe_gating_top_k_hash 内部与后续重复…", "VLLM-ASC-KVMIRROR-MISSING": "VL 模型从 H20+transformers 迁移到昇腾 vLLM 后，从第 7 个 token 起输出与 GPU 对不上并出现乱码：Attention 的 KVMirrorManagerHook / KVMirrorManager 未随模型移植，28 层以后 key_states/value_states 取到异常…", "VLLM-ASC-ROPE-CFG-MISMATCH": "tora 模型 + vllm-ascend 统一数据集推理，NPU 评分 54.4 明显低于 GPU 80.6：hf config.json 的 max_position_embedding（16384→8192）与 rope_theta（1000000→10000）取值与模型训练配置不匹配", "VLLM-ASC-XGRAMMAR-REPEAT": "昇腾 vLLM 部署 Qwen2.5-7B-Instruct，某用例偶现持续输出换行、回复不终止：xgrammar 结构化输出的 JSON 约束解码认为字符串已闭合，与模型回复内容完整性冲突", "COMMON-CPU-CACHE-MISS": "Ascend+Kunpeng 平台核心性能指标全面落后于 Ascend+X86（TPOT/TTFT 劣化、吞吐偏低、延迟抖动），但无算子报错、无 NPU 计算异常、无通信报错：未做 CPU 资源隔离，业务进程与其他进程抢占 CPU 核，上下文切换导致 Cache Miss 命中率劣化", "COMMON-CPU-THREAD-SWITCH": "8 机 96 卡训练中每迭代均有一张卡 PyTorch 框架侧 Dequeue 耗时过长（最长 7.9s），同期 Device 无算子执行、CPU 侧 synchronize 多等 92ms：无关后台线程与算子下发线程竞争 CPU，导致下发线程频繁非自愿上下文切换", "COMMON-DISPATCH-BATCH-SMALL": "业务整体 free 时间占比偏高、硬件资源利用率低：未充分利用硬件（如 batch 过小），通过流水图与 host_to_device 连线可直观看到瓶颈与资源使用情况", "COMMON-GIL-PREEMPTION": "Python 模型业务迁移到 Ascend 平台后整体性能未达预期（耗时偏高、吞吐不足），无算子报错/数据异常/硬件瓶颈，业务核心链路存在大量多线程并发：GIL 单时刻单线程执行 + 工作线程长期持锁不释放，导致其他线程抢锁失败、调度失衡", "COMMON-HCCL-ADDR-ALIGN": "8 卡训练单 step 通信耗时占比 >40%、AllReduce 耗时波动 2~3 倍（计算侧稳定）：自定义算子用 torch.empty() 分配输出 tensor 未指定 memory_format，起始地址不满足 HCCL 128 字节对齐，触发 HCCL 内部对齐拷贝（约 200ms）", "COMMON-IRQ-IMBALANCE": "A+K 平台整体吞吐/延迟明显劣于 A+X，排除算子、NPU 计算、内存、网络、环境、驱动后：部分 CPU 核心中断次数异常偏高，硬件中断过度集中在个别核，持续抢占业务线程时间片，形成慢卡与集群『快等慢』", "COMMON-KERNEL-THREAD-SWITCH": "业务部署后延迟波动大、吞吐不稳、CPU 有效算力利用率偏低、sys 开销偏高：系统全局线程上下文切换次数异常暴涨、内核态 CPU 占用占比过高、任务就绪队列堆积——大量轻量短时线程叠加默认调度配置未做亲和性绑定", "COMMON-KVCACHE-REFCOUNT-LEAK": "推理运行约 12 小时后在第 471 个 step 触发 OOM：custom_attention_forward 算子的 KV-cache 引用计数错误，每 step 约 47MB 中间 tensor 无法回收，累积约 22GB", "COMMON-NONZERO-ACCESS-HEAVY": "op_statistic.csv 中某索引类算子（如 NonZero）占比很大、执行时间明显偏长：访存密集型操作对昇腾达芬奇架构不友好，访存开销主导", "COMMON-NPU-MEM-FRAGMENTATION": "推理过程中显存缓慢增长（每次十几 MB），约 10 小时后 OOM；开启 empty_cache 仍持续上涨，profiling 显示 allocated 基本不涨而 reserved 持续涨——内存碎片累积（非泄漏）", "COMMON-OP-COMPILE-LATENCY": "训练 step 耗时偏高、Host 下发空档大：api_statistic.csv 中 aclopCompile 调用频繁，算子编译额外增加下发耗时，NPU 执行空隙增大（示例 free 占比 22%）", "COMMON-PTHREAD-LOCK-WAIT": "NPU 利用率降低、Device 空闲时间增加等待 Host 下发，单步训练耗时增加、吞吐下降：锁粒度设计错误——整个数据预处理（解码/增强/归一化）都在临界区内执行，平均持锁约 8ms，worker 无法入队形成串行化", "COMMON-PY-GC-LATENCY": "各节点训练单步耗时周期性抖动（示例 2770ms 抖到 2900ms 左右），抖动趋势与发生频率跨节点高度一致：Python 循环引用累积触发自动 GC（标记-清除），GC 的 Stop-The-World 特性阻塞整个进程", "COMMON-SYNC-API-FREQ": "推理/训练中 NPU 整体利用率较低：trace 里大量 aclrtSynchronizeStreamWithTimeout 等同步接口，同步调用期间没有任何其他算子下发，异步下发被打断", "COMMON-SYSCALL-THP": "训练前 500 步性能正常，保存 Checkpoint 后性能下降 20%+ 再缓慢恢复：30GB 量级 D2H 拷贝长期占用 Host 内存，触发内核内存回收与重整，malloc/free 耗时显著增长；透明大页（THP）后台合并进一步抢占训练进程 CPU", "COMMON-EMBEDDING-BWD-EMPTY": "训练 loss NaN（首个 NaN 在 embedding/wte 层梯度）：embedding 反向输入为空时返回默认内存中的未初始化数据——触发源 A：dsp 序列切分致部分卡无 token；触发源 B：数据标注越界致 gt_labels 为空（早期 CANN <8.0.0）", "COMMON-FA-RACE-DETERMINISM": "80 卡大规模训练结果确定性无法固定：CANN 8.1.0 RC1 的 Flash Attention 算子内部数据搬迁前后缺少同步机制（数据竞争），8.0.0 RC4 无此问题", "COMMON-FSDP-OFFLOAD-SYNC-NAN": "MOVA 模型训练 NaN：offload 场景下 FSDP post_backward / foreach_reduce 前后的流同步缺失，.to() 前后的数据搬运时序异常（加同步后问题消失）", "COMMON-RMSNORM-WEIGHT-SCALE": "Gemma 加载权重后重复训练 Loss 差异偏大、grad_norm 异常偏大：加载的 RMSNorm 权重数值异常放大（数值每经一层 RMSNorm 放大约百倍，深层尤甚），随机初始化时正常", "COMMON-SEED-RESET-DETERMINISM": "Qwen2.5-omni 重复训练 loss 与 grad_norm 不一致：业务代码自定义 fix_randn 装饰器内重复调用无参 seed_all()（未带 mode=True），把 torch.use_deterministic_algorithms(True) 重置为 False，aclnn 算子 deter…", "COMMON-TP-SEED-UNSYNCED": "Qwen-Image-Edit 基于 Megatron 在 NPU 上 TP8 推理，跑多个请求时第 3 张生成图必然花图：TP 组内随机种子未同步——0 卡作通信主卡的 random 调用次数与其他卡不同", "VERL-5074": "verl GRPO 启动 A2 报 HCCL error code 5（hcclCommInitRootInfoConfig, RuntimeError: create_config）：runtime_env.yaml 的 HCCL_HOST_SOCKET_PORT_RANGE/HCCL_NPU_SOCKET_PORT…", "VERL-6608": "verl GRPO TP2（npu 上 qwen 4B VL）报 HCCL error code 7（hcclCommInitRootInfoConfig）：HDK 版本与 verl 镜像组合不兼容，换 HDK <script>
/* ================= 工具 ================= */
const $ = (s, el=document) => el.querySelector(s);
const num = n => (n ?? 0).toLocaleString('en-US');
const compact = n => n >= 1e8 ? (n/1e8).toFixed(2)+' 亿' : n >= 1e4 ? (n/1e4).toFixed(n>=1e6?0:1)+' 万' : num(n);
const dur = ms => ms >= 1000 ? (ms/1000).toFixed(ms>=10000?0:1)+'s' : ms+'ms';
const short = id => (DATA.titles[id] || '').replace(/\s+/g,' ').trim();
const pad = n => String(n).padStart(2,'0');
const day = iso => String(iso||'').slice(0,10);

function el(tag, attrs={}, kids=[]) {
  const n = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs)) {
    if (k === 'class') n.className = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k === 'style') n.setAttribute('style', v);
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else if (v !== null && v !== undefined && v !== false) n.setAttribute(k, v);
  }
  for (const c of [].concat(kids)) if (c !== null && c !== undefined && c !== false) n.append(c);
  return n;
}
const STATUS = { in_progress:'运行中', resolved:'已闭环', escalated:'已升级', archived:'已归档', unknown:'未知' };
const statusDot = s => s === 'in_progress' ? 'run' : s === 'resolved' ? 'ok' : s === 'escalated' ? 'warn' : 'mute';

/* ================= 数据：会话行 ================= */
function rows() {
  const real = DATA.runs;
  const want = state.volume;
  if (real.length >= want) return real.slice(0, want);
  const out = real.slice();
  const extra = want - real.length;
  for (let i = 0; i < extra; i++) {
    const base = real[i % real.length];
    out.push(Object.assign({}, base, {
      id: base.id.replace(/\d{4}$/, m => pad((+m + i) % 10000)), synthetic: true,
      updated: base.updated, steps: base.steps, calls: 0, ms: 0, stepms: [], has_cost: false,
    }));
  }
  return out;
}

/* ================= 共享块 ================= */
function metricsCompact() {
  const g = DATA.generated, h = DATA.health;
  const fails = h.findings.filter(f => f.level === 'fail');
  const unread = h.findings.filter(f => f.face === '数字可信度');
  return el('div', {}, [
    el('div', { class:'kpi' }, [
      el('div', {}, [el('div',{class:'k'},'覆盖'), el('div',{class:'v',html:`${DATA.runs.length}<small>会话</small>`})]),
      el('div', {}, [el('div',{class:'k'},'越界'), el('div',{class:'v',html:`${fails.length}<small>项</small>`})]),
      el('div', {}, [el('div',{class:'k'},'零选中'), el('div',{class:'v',html:`${g.cold.cases}<small>条</small>`})]),
      el('div', {}, [el('div',{class:'k'},'不可解读'), el('div',{class:'v',html:`${unread.length}<small>项</small>`})]),
    ]),
    el('section',{class:'blk'},[
      el('h2',{class:'sec'},['本期该做什么']),
      el('div',{class:'mlist'}, fails.slice(0,3).map(f=>el('div',{class:'m'},[
        el('span',{class:'lab'},(f.plain||f.text).split('——')[0].slice(0,30)),
        el('span',{class:'mv'},'越界'),
      ]))),
    ]),
    el('section',{class:'blk'},[
      el('h2',{class:'sec'},['条目使用 · 本期']),
      el('div',{class:'mlist'}, topCases(4).map(c=>el('div',{class:'m'},[
        el('span',{class:'n mono'},c.id), el('span',{class:'mv'},String(c.selected)),
      ]))),
    ]),
  ]);
}

function topCases(n) {
  return DATA.generated.cases.slice().sort((a,b)=>b.selected-a.selected).slice(0,n);
}

function metricsFull(idPrefix='') {
  const g = DATA.generated, h = DATA.health;
  const fails = h.findings.filter(f => f.level === 'fail');
  const unread = h.findings.filter(f => f.face === '数字可信度');
  const cases = DATA.generated.cases.slice().sort((a,b)=>b.selected-a.selected).slice(0,8);
  const maxSel = Math.max(...cases.map(c=>c.selected),1);
  const tools = DATA.detail.tool_rows.filter(t=>!['ask_user_question','job_output','job_kill'].includes(t.tool)).slice(0,7);
  const maxP90 = Math.max(...tools.map(t=>t.p90),1);
  const sec = (id, title, kids) => el('section', { class:'blk', id: idPrefix+id }, [el('h2',{class:'sec'},[title]), ...[].concat(kids)]);

  return el('div', {}, [
    sec('todo','本期该做什么', el('div',{class:'mlist'}, fails.slice(0,4).map((f,i)=>el('div',{class:'m'},[
      el('span',{class:'lab',html:`<span class="num" style="color:var(--ink-3);margin-right:6px">${i+1}</span>${(f.plain||f.text).split('——')[0].slice(0,44)}`}),
      el('span',{class:'mv'},f.face),
    ])))),
    sec('unread','不可解读', el('div',{class:'mlist'}, unread.map(f=>el('div',{class:'m'},[
      el('span',{class:'lab'},(f.plain||f.text).slice(0,40)), el('span',{class:'tag bad'},'无分母'),
    ])))),
    sec('rank','条目使用', el('table',{class:'rank'},[
      el('thead',{},[el('tr',{},[el('th',{},'#'),el('th',{},'条目'),el('th',{},'本期被选中'),el('th',{class:'r'},'计数')])]),
      el('tbody',{}, cases.map((c,i)=>el('tr',{},[
        el('td',{style:'color:var(--ink-3);width:16px'},String(i+1)),
        el('td',{},[el('div',{class:'n'},c.id), el('div',{class:'hint',style:'max-width:30ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap'},short(c.id))]),
        el('td',{style:'width:34%'}, el('div',{class:'bar'}, el('i',{style:`width:${c.selected/maxSel*100}%`}))),
        el('td',{class:'r'},String(c.selected)),
      ])))
    ])),
    sec('tools','工具分布', el('div',{class:'mlist'}, tools.map(t=>el('div',{class:'m'},[
      el('span',{class:'lab mono'},t.tool),
      el('span',{class:'mv'},`${t.calls} 次 · p90 ${dur(t.p90)}`),
    ])))),
    sec('cold','长期零选中', el('div',{},[
      el('div',{class:'num',style:'font-size:32px',html:`${g.cold.cases}<small style="font-family:var(--sans);font-size:11px;color:var(--ink-3);margin-left:5px">条案例</small>`}),
      el('div',{class:'hint',style:'margin-top:6px;line-height:1.6'},'本期与跨期都没被选中过。按检索覆盖判断，不据此退休。'),
    ])),
  ]);
}

function diagDetail(run, opts={}) {
  const d = DATA.detail;
  const isCurrent = run.id === DATA.session;
  const steps = isCurrent ? d.steps : null;
  const stepCost = isCurrent ? d.step_cost : null;
  const STEP_SHORT = {1:'路由',2:'键触发',3:'候选验证',4:'探询',5:'深度排查',6:'结论'};
  const box = el('div', {});

  box.append(el('div', { class:'concl' }, [
    el('div',{},[el('div',{class:'k'},'状态'),el('div',{class:'v'},STATUS[run.status]||run.status||'—')]),
    el('div',{},[el('div',{class:'k'},'平台 / 类别'),el('div',{class:'v'},`${run.platform||'—'} · ${run.category||'—'}`)]),
    el('div',{},[el('div',{class:'k'},'命中'),el('div',{class:'v'},run.excluded?`未命中（排除 ${run.excluded} 条）`:'未命中')]),
    el('div',{},[el('div',{class:'k'},'沉淀 / 回报'),el('div',{class:'v'},`${run.sediment} 条 · ${run.outcome||'pending'}`)]),
    el('div',{},[el('div',{class:'k'},'步 / 动作'),el('div',{class:'v num',html:`${run.steps} / ${run.actions}`})]),
    el('div',{},[el('div',{class:'k'},'工具调用'),el('div',{class:'v num',html:run.calls?`${run.calls} 次`:'<span class="hint">本次没记</span>'})]),
    el('div',{},[el('div',{class:'k'},'工具耗时'),el('div',{class:'v num',html:run.ms?dur(run.ms):'<span class="hint">本次没记</span>'})]),
    el('div',{},[el('div',{class:'k'},'token'),el('div',{class:'v num',html:run.tok?compact(run.tok):'<span class="hint">本次没记</span>'})]),
  ]));

  if (!isCurrent) {
    box.append(el('div',{class:'hint',style:'padding:12px 0;line-height:1.6'},
      '这条会话的步详情在原型里没有内联（真实面板会从主检出读它的轨迹与本机明细）。原型内联了 ' + DATA.session + ' 的完整明细，点它看瀑布。'));
    return box;
  }

  box.append(el('div',{class:'lede'}, (DATA.detail.summary_short||'').slice(0,300) + '…'));

  // 步轨
  const byStep = Object.fromEntries((steps||[]).map(s=>[s.step,s]));
  const maxAct = Math.max(...(steps||[{actions:{length:1}}]).map(s=>s.actions.length),1);
  box.append(el('section',{class:'blk'},[
    el('h2',{class:'sec'},['各步', el('span',{class:'hint'},'圆点=有事件；虚线=轨迹里没有这一步（不补）')]),
    el('div',{class:'rail6'}, [1,2,3,4,5,6].map(n=>{
      const x = byStep[n];
      return el('div',{class:'nd '+(x?'has':'gap')},[
        el('div',{class:'n'}, x?String(n):'·'),
        el('div',{class:'nm'},STEP_SHORT[n]),
        el('div',{class:'nc'}, x?`${x.actions.length} 动作`:'无事件'),
      ]);
    })),
  ]));

  // 每步成本
  if (stepCost && stepCost.length) {
    const maxMs = Math.max(...stepCost.map(r=>r.ms),1);
    const maxTok = Math.max(...stepCost.map(r=>r.tokens.uncached+r.tokens.cache_read+r.tokens.out),1);
    const total = stepCost.reduce((a,r)=>a+r.ms,0);
    const totalTok = stepCost.reduce((a,r)=>a+r.tokens.uncached+r.tokens.cache_read+r.tokens.out,0);
    const worst = stepCost.slice().sort((a,b)=>b.ms-a.ms)[0];
    box.append(el('section',{class:'blk'},[
      el('h2',{class:'sec'},['每步成本', el('span',{class:'right hint',html:`合计 ${dur(total)} · ${compact(totalTok)} tok · 最贵是步 ${worst.step}`})]),
      el('div',{class:'wf'}, stepCost.map(r=>{
        const tok = r.tokens.uncached+r.tokens.cache_read+r.tokens.out;
        return el('div',{class:'wfrow'},[
          el('div',{class:'wfl'},[el('span',{class:'wfn num'},String(r.step)),el('span',{},STEP_SHORT[r.step]||'')]),
          el('div',{class:'wfb'},[
            el('div',{class:'ms'},el('i',{style:`width:${Math.max(1,r.ms/maxMs*100)}%`})),
            el('div',{class:'tk'},el('i',{style:`width:${Math.max(1,tok/maxTok*100)}%`})),
          ]),
          el('div',{class:'wfv'},[dur(r.ms), el('span',{},`${r.calls} 次 · ${compact(tok)} tok`)]),
        ]);
      })),
      el('div',{class:'hint',style:'margin-top:8px;line-height:1.6'},
        '耗时与 token 来自会话账单，按每步首个事件的 ts 切窗口；粗条=耗时，细条=token。窗口切不出来整段不显示。'),
    ]));
  } else {
    box.append(el('section',{class:'blk'},[
      el('h2',{class:'sec'},['每步成本']),
      el('div',{class:'hint',style:'line-height:1.6'},'轨迹事件没带 ts，切不出窗口。不按事件顺序估。'),
    ]));
  }

  // 检索 + 成本
  const r = DATA.detail.retrieval || {};
  const nIdx = r.load_index_cases||0, nCand = (r.candidates||[]).length, nHit = 0;
  box.append(el('section',{class:'blk'},[
    el('h2',{class:'sec'},['检索走向']),
    el('div',{class:'funnel'},[
      el('div',{class:'fr'},[el('span',{},'类视图'),el('div',{class:'fb',style:'width:100%'},String(nIdx)),el('span',{class:'fn'},'inference/vllm-ascend × interrupt')]),
      el('div',{class:'fr'},[el('span',{},'进候选'),el('div',{class:'fb',style:`width:${Math.max(nCand/nIdx*100,4)}%`},String(nCand)),el('span',{class:'fn'},'按 sig/tok 收敛')]),
      el('div',{class:'fr'},[el('span',{},'命中'),el('div',{class:'fb z',style:'width:4%'},String(nHit)),el('span',{class:'fn'},'全排除 → 转流程')]),
    ]),
    el('div',{class:'mlist',style:'margin-top:10px'}, [
      ...(r.excluded||[]).map(id=>el('div',{class:'m'},[el('span',{class:'mono'},id),el('span',{class:'mv'},'已排除')])),
    ]),
  ]));
  return box;
}

/* 会话行（列表/表共用） */
function runRow(run, onClick, cols) {
  const meta = `${run.platform||'—'} · ${run.category||'—'} · ${run.steps} 步`;
  return el('div', {
    class:'run' + (run.synthetic?' synthetic':''),
    'aria-current': run.id === state.sel ? 'true' : 'false',
    style: cols ? `grid-template-columns:${cols}` : 'grid-template-columns:10px minmax(0,1fr) 74px',
    onclick: () => onClick(run),
  }, [
    el('span',{class:'dot '+statusDot(run.status), style:'margin-top:4px'}),
    el('div',{style:'min-width:0'},[
      el('div',{class:'rid'},[el('span',{class:'rid-d'},run.id.slice(0,10)), el('span',{class:'rid-t'},run.id.slice(11))]),
      el('div',{class:'meta'},meta)]),
    el('div',{style:'text-align:right;min-width:0'},[
      run.has_cost ? el('div',{class:'mono',style:'font-size:10px;color:var(--ink-2)'},dur(run.ms)) : null,
      el('div',{style:'margin-top:1px'}, el('span',{class:'tag '+(run.status==='in_progress'?'sig':'mute'),style:'font-size:9px;padding:0 4px'},STATUS[run.status]||'—')),
    ]),
  ]);
}

/* ================= 方案 A：渐进式披露 ================= */
function schemeA() {
  const rs = rows();
  const groups = [
    ['运行中 / 待回报', rs.filter(r=>r.status==='in_progress')],
    ['已闭环', rs.filter(r=>r.status==='resolved')],
    ['其余（升级 / 归档 / 未知）', rs.filter(r=>!['in_progress','resolved'].includes(r.status))],
  ];
  const rail = el('div',{class:'rail'}, groups.filter(g=>g[1].length).map(([name, list]) =>
    el('div',{class:'grp'}, el('details',{open: name.startsWith('运行中') ? '' : null}, [
      el('summary',{class:'grph'},[el('span',{},name), el('span',{class:'cnt'},String(list.length))]),
      el('div',{}, list.slice(0, name.startsWith('运行中') ? 8 : 4).map(r=>runRow(r, pick))),
      list.length > 4 && !name.startsWith('运行中')
        ? el('div',{class:'hint',style:'padding:4px 10px'},`展开全部 ${list.length} 条…`) : null,
    ])),
  ));
  const main = el('div',{},[
    el('div',{style:'display:flex;gap:10px;align-items:center;margin-bottom:10px'},[
      el('div',{style:'flex:1'}, el('input',{placeholder:'搜索会话 id / 平台 / 类别',style:'width:100%;background:var(--card);border:1px solid var(--line-2);border-radius:6px;padding:5px 9px;font:inherit;font-size:12px;color:inherit'})),
      el('span',{class:'hint'},'方案 A：左栏按状态分组、可折叠，详情内块可折叠'),
    ]),
    diagDetail(currentRun(rs)),
  ]);
  return el('div',{class:'A'},[rail, main]);
}

/* ================= 方案 B：目录 → 阅读页 ================= */
function schemeB() {
  const rs = rows();
  if (state.reader) {
    const run = currentRun(rs);
    return el('div',{},[
      el('div',{class:'crumb'},[
        el('button',{onclick:()=>{state.reader=false;render()}},'← 返回列表'),
        el('span',{class:'mono',style:'font-size:12px'},run.id),
        el('span',{class:'hint'},'方案 B：目录用密集表格，一屏几十条；点进去是整页阅读'),
      ]),
      diagDetail(run),
    ]);
  }
  const tb = el('tbody');
  rs.forEach(r=>{
    tb.append(el('tr',{onclick:()=>{state.sel=r.id;state.reader=true;render()}},[
      el('td',{style:'width:16px'},el('span',{class:'dot '+statusDot(r.status)})),
      el('td',{},[el('div',{class:'rid'},[el('span',{style:'color:var(--ink-3)'},r.id.slice(0,10)), el('span',{style:'margin-left:5px'},r.id.slice(11))]),
                  el('div',{class:'hint',style:'font-size:10px'},short(r.id).slice(0,52))]),
      el('td',{class:'hint'},r.platform||'—'),
      el('td',{class:'hint'},r.category||'—'),
      el('td',{class:'c'},String(r.steps)),
      el('td',{class:'c'},String(r.actions)),
      el('td',{class:'c'},r.has_cost?dur(r.ms):'—'),
      el('td',{class:'c'},r.tok?compact(r.tok):'—'),
      el('td',{}, r.stepms && r.stepms.length
        ? el('div',{class:'spark'}, (() => { const mx = Math.max(...r.stepms, 1); return r.stepms.map(v=>el('i',{style:`height:${Math.max(2,v/mx*14)}px`})); })())
        : el('span',{class:'hint',style:'font-size:10px'},'—')),
      el('td',{},el('span',{class:'tag '+(r.status==='in_progress'?'sig':'mute')},STATUS[r.status]||'—')),
      el('td',{class:'c'},r.sediment?String(r.sediment):'—'),
    ]));
  });
  return el('div',{class:'B'},[
    el('div',{class:'hint',style:'margin-bottom:10px'},'方案 B：目录页（不是卡片列表）。一屏能扫 20–30 条；点任意一行进入整页阅读。'),
    el('table',{},[
      el('thead',{},el('tr',{},[
        el('th',{}),el('th',{},'会话'),el('th',{},'平台'),el('th',{},'类别'),
        el('th',{style:'text-align:right'},'步'),el('th',{style:'text-align:right'},'动作'),
        el('th',{style:'text-align:right'},'耗时'),el('th',{style:'text-align:right'},'token'),
        el('th',{},'步成本'),el('th',{},'状态'),el('th',{style:'text-align:right'},'沉淀'),
      ])),
      tb,
    ]),
  ]);
}

/* ================= 方案 C：时间轴工作台 ================= */
function schemeC() {
  const rs = rows();
  const days = {};
  rs.forEach(r=>{ (days[day(r.updated)] = days[day(r.updated)]||[]).push(r); });
  const tl = el('div',{class:'tl'});
  Object.keys(days).sort().reverse().forEach(d=>{
    tl.append(el('div',{style:'font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin:14px 0 8px;position:relative;left:-18px'},d));
    days[d].forEach(r=>{
      const on = r.id === state.sel;
      const maxMs = Math.max(...rs.map(x=>x.ms),1);
      tl.append(el('div',{class:'beat '+(on?'on':'')},[
        el('div',{class:'runsplit'},[
          runRow(r, pick),
          el('div',{class:'bar',style:'height:4px'},el('i',{style:`width:${Math.max(1,r.ms/maxMs*100)}%`})),
        ]),
        on ? el('div',{class:'open'}, diagDetail(r)) : null,
      ]));
    });
  });
  return el('div',{class:'C'},[tl, el('div',{class:'sticky'},[
    el('div',{class:'hint',style:'margin-bottom:8px'},'方案 C：不分 tab。左侧是会话时间轴（纵向、按天分组、高度=成本），点开就地展开；右侧常驻指标摘要。'),
    el('div',{class:'card',style:'background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px'}, metricsCompact()),
    el('button',{class:'hint',style:'margin-top:10px;border:1px solid var(--line-2);border-radius:6px;padding:4px 10px',onclick:()=>{state.overlay=true;render()}},'展开完整指标 ↗'),
  ])]);
}

/* ================= 方案 D：指标侧栏常驻 ================= */
function schemeD() {
  const rs = rows();
  return el('div',{class:'D'},[
    el('div',{class:'side'},[
      el('div',{class:'hint',style:'margin-bottom:10px;line-height:1.55'},'方案 D：指标变成常驻左栏（摘要级），诊断占主区；两者不再互为 tab。'),
      metricsCompact(),
    ]),
    el('div',{class:'main'},[
      el('div',{class:'list'}, rs.map(r=>runRow(r, pick))),
      diagDetail(currentRun(rs)),
    ]),
  ]);
}

/* ================= 状态与挂载 ================= */
const SCHEMES = [
  ['A','渐进式披露'], ['B','目录 → 阅读'], ['C','时间轴工作台'], ['D','指标侧栏常驻'],
];
const NOTES = {
  A:'方案 A · 保留现有两个 tab。诊断：左栏按状态分组、默认只展开一组，右栏详情内的块可折叠。指标：单页滚动，右侧加锚点目录。改动最小，会话变多时靠折叠与分组扛。',
  B:'方案 B · 把「诊断」拆成两级：默认是密集目录（表格，一屏 20–30 条），点进去是整页阅读。会话再多，目录也只是变长，不会挤掉阅读空间。',
  C:'方案 C · 不分 tab。一条纵向时间轴把诊断按天铺开，高度表示成本，点开就地展开详情；指标压缩成右侧常驻摘要。适合「边跑边看」和「连续回看」。',
  D:'方案 D · 指标变成常驻侧栏（只放摘要：覆盖/越界/不可解读/条目使用 TOP4），诊断占主区，左名单 + 右详情。适合既想盯流程又不想离开指标的人。',
};
const state = { scheme:'A', volume:20, sel: DATA.session, reader:false, overlay:false };
// 支持 #B / #C / #D 与 #v=60，方便截图与分享某一种方案
(() => {
  const h = location.hash.replace('#','');
  const m = /([ABCD])/.exec(h); if (m) state.scheme = m[1];
  const v = /v=(\d+)/.exec(h); if (v) state.volume = Math.max(20, +v[1]);
  if (/dark/.test(h)) document.documentElement.setAttribute('data-theme','dark');
})();

$('#schemeSeg').append(...SCHEMES.map(([k,label])=>
  el('button',{ 'data-k':k, 'aria-pressed':String(state.scheme===k), onclick:()=>{state.scheme=k;state.reader=false;render();} }, k+' · '+label)));
[...$('#volumeSeg').children].forEach(b=>b.onclick=()=>{
  state.volume=+b.dataset.v;
  [...$('#volumeSeg').children].forEach(x=>x.setAttribute('aria-pressed',String(x===b)));
  render();
});
$('#theme').onclick=()=>{
  const cur=document.documentElement.getAttribute('data-theme');
  document.documentElement.setAttribute('data-theme', cur==='dark'?'light':'dark');
};

function currentRun(rs) { return rs.find(r=>r.id===state.sel) || rs[0]; }
function pick(run) { state.sel = run.id; render(); }

function render() {
  [...$('#schemeSeg').children].forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.k===state.scheme)));
  $('#note').innerHTML = NOTES[state.scheme] + (state.volume>DATA.runs.length
    ? ` <b>（压力测试：真实 ${DATA.runs.length} 条 + ${state.volume-DATA.runs.length} 条占位，占位行左侧有虚线）</b>` : '');
  const stage = $('#stage'); stage.innerHTML='';
  stage.append({A:schemeA,B:schemeB,C:schemeC,D:schemeD}[state.scheme]());
  if (state.overlay) {
    const ov = el('div',{style:'position:fixed;inset:0;z-index:40;background:color-mix(in srgb,var(--paper) 96%,transparent);backdrop-filter:blur(6px);overflow:auto'},[
      el('div',{style:'max-width:980px;margin:0 auto;padding:26px 24px 80px'},[
        el('div',{style:'display:flex;align-items:center;gap:12px;margin-bottom:16px'},[
          el('h1',{style:'font-size:16px'},'完整指标'),
          el('button',{class:'hint',style:'margin-left:auto;border:1px solid var(--line-2);border-radius:6px;padding:4px 10px',onclick:()=>{state.overlay=false;render()}},'关闭 ✕'),
        ]),
        metricsFull('ov-'),
      ]),
    ]);
    document.body.append(ov);
  }
}
render();
</script>
