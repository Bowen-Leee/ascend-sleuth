<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ascend-sleuth 面板 · 指标与诊断（设计稿）</title>
<style>
/* ============================================================
   设计语言：工程仪器 × 编辑设计
   - 底色是暖纸，不是纯白；文字是墨，不是纯黑
   - 数据只有一个主色（朱），语义色只用于状态
   - 数字用衬线 + tabular-nums：读起来像仪表刻度，不像 SaaS 大屏
   - 分隔用发丝线，不用卡片阴影；块与块靠留白与字号分层
   ============================================================ */
:root{
  --paper:#f7f4ee; --paper-2:#f1ede4; --card:#fbf9f5;
  --ink:#1a1713; --ink-2:#5d564b; --ink-3:#8d8577;
  --line:#e2dccd; --line-2:#cfc7b4;
  --signal:#b3401f; --signal-2:#d9603a; --signal-soft:rgba(179,64,31,.10);
  --good:#2f6f4a; --warn:#8a6410; --bad:#a32b22; --mute:#7c7568;
  --serif:"Charter","Iowan Old Style","Songti SC",Georgia,serif;
  --sans:"Avenir Next","PingFang SC","Hiragino Sans GB","Helvetica Neue",sans-serif;
  --mono:"SF Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:10px;
}
html[data-theme=dark]{
  --paper:#14130f; --paper-2:#1a1814; --card:#1d1b16;
  --ink:#f2eee4; --ink-2:#b3ac9d; --ink-3:#7e776a;
  --line:#2b2822; --line-2:#3b372e;
  --signal:#e0703f; --signal-2:#f08a5c; --signal-soft:rgba(224,112,63,.14);
  --good:#67b68c; --warn:#d6a44a; --bad:#e06a5e; --mute:#8b8477;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font:14px/1.55 var(--sans);
  -webkit-font-smoothing:antialiased;
  padding:0 0 96px;
}
::selection{background:var(--signal-soft)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
h1,h2,h3{margin:0;font-weight:600}
.num{font-family:var(--serif);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.mono{font-family:var(--mono);font-size:.92em}
.app{max-width:1220px;margin:0 auto;padding:0 32px}

/* ---------- 顶栏 ---------- */
.topbar{display:flex;align-items:baseline;gap:18px;padding:26px 0 0}
.mark{font-family:var(--serif);font-size:19px;letter-spacing:.01em}
.mark em{font-style:normal;color:var(--signal)}
.sub{color:var(--ink-3);font-size:12px;letter-spacing:.14em;text-transform:uppercase}
.topbar .grow{flex:1}
.chip{
  display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;
  border:1px solid var(--line-2);border-radius:999px;font-size:12px;color:var(--ink-2);
  font-family:var(--mono)
}
.chip b{color:var(--ink);font-weight:600}
.ghost{color:var(--ink-2);font-size:12.5px;padding:4px 8px;border-radius:6px}
.ghost:hover{background:var(--paper-2);color:var(--ink)}

/* ---------- tab ---------- */
.tabs{display:flex;gap:26px;margin:22px 0 0;border-bottom:1px solid var(--line)}
.tabs button{
  position:relative;padding:0 0 11px;font-size:15px;color:var(--ink-3);
  transition:color .18s cubic-bezier(.16,1,.3,1)
}
.tabs button[aria-selected=true]{color:var(--ink)}
.tabs button[aria-selected=true]::after{
  content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--signal)
}
.tabs button:hover{color:var(--ink)}
.tabs .meta{margin-left:auto;padding-bottom:11px;color:var(--ink-3);font-size:12px}

/* ---------- 仪器条 ---------- */
.strip{
  display:grid;grid-template-columns:repeat(5,1fr);
  border-bottom:1px solid var(--line);margin-bottom:26px
}
.strip>div{padding:16px 0 15px;border-right:1px solid var(--line)}
.strip>div:first-child{padding-left:0}
.strip>div:last-child{border-right:0}
.strip .k{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);margin-bottom:5px}
.strip .v{font-family:var(--serif);font-size:23px;font-variant-numeric:tabular-nums;line-height:1.1}
.strip .v small{font-family:var(--sans);font-size:12px;color:var(--ink-2);margin-left:5px;letter-spacing:0}
.strip .note{margin-top:3px;font-size:11.5px;color:var(--ink-3)}

/* ---------- 栅格 ---------- */
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:30px 22px;margin-bottom:30px}
.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}
.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}
.c9{grid-column:span 9}.c12{grid-column:span 12}
@media (max-width:980px){
  .strip{grid-template-columns:repeat(2,1fr)}
  .c3,.c4,.c5,.c6,.c7,.c8,.c9{grid-column:span 12}
}
h2{font-size:12px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-2);
   display:flex;align-items:center;gap:9px;margin-bottom:13px}
h2::before{content:"";width:2px;height:12px;background:var(--signal);border-radius:1px}
h2 .cnt{font-family:var(--sans);letter-spacing:0;text-transform:none;color:var(--ink-3);font-size:12px}
h2 .right{margin-left:auto;display:flex;gap:2px;align-items:center}
h3{font-size:11.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);margin-bottom:10px}

/* ---------- 本期该做什么 ---------- */
.todo{list-style:none;margin:0;padding:0}
.todo li{
  display:grid;grid-template-columns:22px 1fr auto;gap:12px;align-items:start;
  padding:12px 0;border-bottom:1px solid var(--line)
}
.todo li:first-child{border-top:1px solid var(--line)}
.todo .idx{font-family:var(--serif);color:var(--ink-3);font-size:15px;padding-top:1px}
.todo .t{font-size:14px;line-height:1.5}
.todo .why{color:var(--ink-3);font-size:12px;margin-top:4px}
.todo code{
  display:inline-block;margin-top:6px;font-family:var(--mono);font-size:11.5px;
  color:var(--ink-2);background:var(--paper-2);border:1px solid var(--line);
  border-radius:5px;padding:2px 7px
}
.dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto;display:inline-block}
.dot.bad{background:var(--bad)}.dot.warn{background:var(--warn)}
.dot.ok{background:var(--good)}.dot.mute{background:var(--mute)}
.sev{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-3);white-space:nowrap;padding-top:3px}

/* ---------- 右侧状态块 ---------- */
.block{border-top:1px solid var(--line-2);padding:14px 0 6px}
.block:first-child{border-top:0;padding-top:0}
.block .row{display:grid;grid-template-columns:1fr auto;gap:10px;padding:7px 0;align-items:baseline}
.block .row .n{font-size:13.5px}
.block .row .v{font-family:var(--serif);font-size:16px;font-variant-numeric:tabular-nums}
.block .row .why{grid-column:1/-1;color:var(--ink-3);font-size:11.5px;line-height:1.45;margin-top:-2px}
.tag{display:inline-block;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;
     padding:1px 6px;border-radius:4px;border:1px solid currentColor}
.tag.bad{color:var(--bad)}.tag.warn{color:var(--warn)}.tag.ok{color:var(--good)}
.tag.mute{color:var(--mute)}.tag.sig{color:var(--signal)}

/* ---------- 排行表 ---------- */
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:999px;padding:2px;gap:2px;margin-left:auto}
.seg button{font-size:11.5px;padding:2px 10px;border-radius:999px;color:var(--ink-3)}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--paper)}
table.rank{width:100%;border-collapse:collapse}
table.rank th{
  text-align:left;font-weight:500;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-3);padding:0 0 8px;border-bottom:1px solid var(--line-2)
}
table.rank th.r,table.rank td.r{text-align:right}
table.rank td{padding:9px 0;border-bottom:1px solid var(--line);vertical-align:middle}
table.rank tr:last-child td{border-bottom:0}
table.rank tr:hover td{background:var(--signal-soft)}
.id{font-family:var(--mono);font-size:12.5px;white-space:nowrap}
.ti{color:var(--ink-3);font-size:12px;margin-top:2px;max-width:38ch;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
.barcell{width:34%;padding-left:14px!important}
.bar{height:6px;background:var(--paper-2);border-radius:3px;overflow:hidden;position:relative}
.bar i{display:block;height:100%;background:var(--signal);border-radius:3px;width:0;
       transition:width .5s cubic-bezier(.16,1,.3,1)}
.bar.mut i{background:var(--line-2)}
.ct{font-family:var(--serif);font-variant-numeric:tabular-nums;font-size:14px}

/* ---------- 图表 ---------- */
svg{display:block;overflow:visible}
.ax{stroke:var(--line-2);stroke-width:1}
.tick{font:10.5px var(--sans);fill:var(--ink-3)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:12px;font-size:11.5px;color:var(--ink-2)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}
.hint{font-size:11.5px;color:var(--ink-3);letter-spacing:0;text-transform:none;font-weight:400}
.mini{display:grid;grid-template-columns:1fr auto;gap:6px 12px;padding:7px 0;
      border-bottom:1px solid var(--line);font-size:12.5px}
.mini:last-child{border-bottom:0}
.mini .lab{color:var(--ink-2)}
.mini .val{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);white-space:nowrap}
.big{font-family:var(--serif);font-size:40px;line-height:1;font-variant-numeric:tabular-nums}
.big small{font-family:var(--sans);font-size:12px;color:var(--ink-3);margin-left:6px;letter-spacing:0}

/* ---------- 诊断 tab ---------- */
.split{display:grid;grid-template-columns:290px 1fr;gap:26px;margin-top:24px}
@media (max-width:980px){.split{grid-template-columns:1fr}}
.sessions{border-right:1px solid var(--line);padding-right:20px;max-height:760px;overflow:auto}
.sessions .s{
  display:grid;grid-template-columns:9px 1fr;gap:9px;padding:9px 8px;border-radius:7px;
  cursor:pointer;align-items:start
}
.sessions .s:hover{background:var(--paper-2)}
.sessions .s[aria-current=true]{background:var(--signal-soft)}
.sessions .s .id{font-size:11.5px;word-break:break-all;line-height:1.35}
.sessions .s .m{color:var(--ink-3);font-size:10.5px;margin-top:2px}
.sessions .s .st{margin-top:4px;display:flex;gap:5px;flex-wrap:wrap}
.conclusion{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);
            border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:8px}
.conclusion>div{background:var(--card);padding:12px 14px}
.conclusion .k{font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);margin-bottom:4px}
.conclusion .v{font-size:13.5px;line-height:1.4}
.conclusion .v.num{font-size:19px}
.lede{font-size:13px;color:var(--ink-2);line-height:1.6;margin:10px 0 26px;max-width:78ch}
.funnel{display:grid;gap:2px;margin:4px 0 14px}
.funnel .fr{display:grid;grid-template-columns:82px 1fr 176px;gap:12px;align-items:center;font-size:12.5px}
.funnel .fn{line-height:1.35}
.funnel .fb{height:26px;background:var(--signal);border-radius:3px;opacity:.9;
            display:flex;align-items:center;justify-content:flex-end;padding-right:8px;
            color:#fff;font-family:var(--mono);font-size:11.5px;min-width:34px;
            transition:width .5s cubic-bezier(.16,1,.3,1)}
.funnel .fb.z{background:var(--line-2);color:var(--ink-2)}
.funnel .fl{color:var(--ink-2)}
.funnel .fn{color:var(--ink-3);font-size:11px;text-align:right}
.refs{display:grid;gap:0}
.refs .r{display:grid;grid-template-columns:1fr auto auto;gap:10px;padding:7px 0;
         border-bottom:1px solid var(--line);align-items:center;font-size:12.5px}
.refs .r:last-child{border-bottom:0}
.cost{display:grid;grid-template-columns:88px 1fr 64px;gap:10px;align-items:center;padding:5px 0}
.cost .cb{height:14px;background:var(--paper-2);border-radius:3px;overflow:hidden}
.cost .cb i{display:block;height:100%;border-radius:3px}
.cost .cv{text-align:right;font-family:var(--mono);font-size:11px;color:var(--ink-3)}
.rail{display:grid;grid-template-columns:repeat(6,1fr);gap:0;margin:6px 0 2px}
.rail .node{position:relative;padding:0 8px 0 0}
.rail .node::before{content:"";position:absolute;left:0;right:0;top:11px;height:1px;background:var(--line-2)}
.rail .node:first-child::before{left:11px}
.rail .node:last-child::before{right:calc(100% - 11px)}
.rail .n{position:relative;z-index:1;width:23px;height:23px;border-radius:50%;display:grid;place-items:center;
         background:var(--card);border:1px solid var(--line-2);font-family:var(--serif);font-size:12.5px;color:var(--ink-2)}
.rail .node.has .n{background:var(--signal);border-color:var(--signal);color:#fff}
.rail .node.gap .n{border-style:dashed;color:var(--ink-3)}
.rail .nm{font-size:12px;margin-top:7px;color:var(--ink-2)}
.rail .nb{margin-top:6px;height:4px;background:var(--paper-2);border-radius:2px;overflow:hidden;max-width:78px}
.rail .nb i{display:block;height:100%;background:var(--signal);opacity:.75}
.rail .nc{font-size:10.5px;color:var(--ink-3);margin-top:4px;font-family:var(--mono)}
.rail .na{margin-top:5px;display:flex;gap:3px;flex-wrap:wrap}
.rail .na .tag{font-size:9.5px;padding:1px 4px}
.wfhead{display:flex;gap:26px;align-items:baseline;margin:18px 0 12px;padding-top:14px;border-top:1px solid var(--line)}
.wfhead .num{font-size:26px}
.wfhead .num small{font-family:var(--sans);font-size:11.5px;color:var(--ink-3);margin-left:5px;letter-spacing:0}
.wf{display:grid;gap:2px}
.wfrow{display:grid;grid-template-columns:132px 1fr 150px;gap:14px;align-items:center;padding:5px 0}
.wfrow:hover{background:var(--signal-soft)}
.wfl{display:flex;gap:8px;align-items:baseline;font-size:12.5px;color:var(--ink-2)}
.wfn{font-size:14px;color:var(--ink)}
.wfb{display:grid;gap:3px}
.wfb .ms{position:relative;height:15px;background:var(--paper-2);border-radius:2px}
.wfb .ms i{position:absolute;left:0;top:0;bottom:0;background:var(--signal);border-radius:2px}

.wfb .tk{height:3px;background:var(--paper-2);border-radius:2px;overflow:hidden}
.wfb .tk i{display:block;height:100%;background:var(--ink-3);opacity:.55}
.wfv{text-align:right;font-family:var(--mono);font-size:12px;color:var(--ink);line-height:1.5}
.wfv b{font-weight:500}
.wfv span{display:block;color:var(--ink-3);font-size:10.5px}
.empty{padding:28px 0;color:var(--ink-3);font-size:13px;text-align:center}
.foot{margin-top:34px;padding-top:14px;border-top:1px solid var(--line);
      color:var(--ink-3);font-size:11.5px;display:flex;gap:16px;flex-wrap:wrap}
.foot .mono{font-size:11px}
</style>
</head>

eek-V4 Pro 在 Atlas 800I A3 上 GPQA 评分明显偏低（同模型其他环境正常）：三个独立根因叠加——rope 转 float32、Dequantswigluquant/GMMswigluquant 的 clamp 缺陷（主因）、moe_gating_top_k_hash 内部与后续重复…", "VLLM-ASC-KVMIRROR-MISSING": "VL 模型从 H20+transformers 迁移到昇腾 vLLM 后，从第 7 个 token 起输出与 GPU 对不上并出现乱码：Attention 的 KVMirrorManagerHook / KVMirrorManager 未随模型移植，28 层以后 key_states/value_states 取到异常…", "VLLM-ASC-ROPE-CFG-MISMATCH": "tora 模型 + vllm-ascend 统一数据集推理，NPU 评分 54.4 明显低于 GPU 80.6：hf config.json 的 max_position_embedding（16384→8192）与 rope_theta（1000000→10000）取值与模型训练配置不匹配", "VLLM-ASC-XGRAMMAR-REPEAT": "昇腾 vLLM 部署 Qwen2.5-7B-Instruct，某用例偶现持续输出换行、回复不终止：xgrammar 结构化输出的 JSON 约束解码认为字符串已闭合，与模型回复内容完整性冲突", "COMMON-CPU-CACHE-MISS": "Ascend+Kunpeng 平台核心性能指标全面落后于 Ascend+X86（TPOT/TTFT 劣化、吞吐偏低、延迟抖动），但无算子报错、无 NPU 计算异常、无通信报错：未做 CPU 资源隔离，业务进程与其他进程抢占 CPU 核，上下文切换导致 Cache Miss 命中率劣化", "COMMON-CPU-THREAD-SWITCH": "8 机 96 卡训练中每迭代均有一张卡 PyTorch 框架侧 Dequeue 耗时过长（最长 7.9s），同期 Device 无算子执行、CPU 侧 synchronize 多等 92ms：无关后台线程与算子下发线程竞争 CPU，导致下发线程频繁非自愿上下文切换", "COMMON-DISPATCH-BATCH-SMALL": "业务整体 free 时间占比偏高、硬件资源利用率低：未充分利用硬件（如 batch 过小），通过流水图与 host_to_device 连线可直观看到瓶颈与资源使用情况", "COMMON-GIL-PREEMPTION": "Python 模型业务迁移到 Ascend 平台后整体性能未达预期（耗时偏高、吞吐不足），无算子报错/数据异常/硬件瓶颈，业务核心链路存在大量多线程并发：GIL 单时刻单线程执行 + 工作线程长期持锁不释放，导致其他线程抢锁失败、调度失衡", "COMMON-HCCL-ADDR-ALIGN": "8 卡训练单 step 通信耗时占比 >40%、AllReduce 耗时波动 2~3 倍（计算侧稳定）：自定义算子用 torch.empty() 分配输出 tensor 未指定 memory_format，起始地址不满足 HCCL 128 字节对齐，触发 HCCL 内部对齐拷贝（约 200ms）", "COMMON-IRQ-IMBALANCE": "A+K 平台整体吞吐/延迟明显劣于 A+X，排除算子、NPU 计算、内存、网络、环境、驱动后：部分 CPU 核心中断次数异常偏高，硬件中断过度集中在个别核，持续抢占业务线程时间片，形成慢卡与集群『快等慢』", "COMMON-KERNEL-THREAD-SWITCH": "业务部署后延迟波动大、吞吐不稳、CPU 有效算力利用率偏低、sys 开销偏高：系统全局线程上下文切换次数异常暴涨、内核态 CPU 占用占比过高、任务就绪队列堆积——大量轻量短时线程叠加默认调度配置未做亲和性绑定", "COMMON-KVCACHE-REFCOUNT-LEAK": "推理运行约 12 小时后在第 471 个 step 触发 OOM：custom_attention_forward 算子的 KV-cache 引用计数错误，每 step 约 47MB 中间 tensor 无法回收，累积约 22GB", "COMMON-NONZERO-ACCESS-HEAVY": "op_statistic.csv 中某索引类算子（如 NonZero）占比很大、执行时间明显偏长：访存密集型操作对昇腾达芬奇架构不友好，访存开销主导", "COMMON-NPU-MEM-FRAGMENTATION": "推理过程中显存缓慢增长（每次十几 MB），约 10 小时后 OOM；开启 empty_cache 仍持续上涨，profiling 显示 allocated 基本不涨而 reserved 持续涨——内存碎片累积（非泄漏）", "COMMON-OP-COMPILE-LATENCY": "训练 step 耗时偏高、Host 下发空档大：api_statistic.csv 中 aclopCompile 调用频繁，算子编译额外增加下发耗时，NPU 执行空隙增大（示例 free 占比 22%）", "COMMON-PTHREAD-LOCK-WAIT": "NPU 利用率降低、Device 空闲时间增加等待 Host 下发，单步训练耗时增加、吞吐下降：锁粒度设计错误——整个数据预处理（解码/增强/归一化）都在临界区内执行，平均持锁约 8ms，worker 无法入队形成串行化", "COMMON-PY-GC-LATENCY": "各节点训练单步耗时周期性抖动（示例 2770ms 抖到 2900ms 左右），抖动趋势与发生频率跨节点高度一致：Python 循环引用累积触发自动 GC（标记-清除），GC 的 Stop-The-World 特性阻塞整个进程", "COMMON-SYNC-API-FREQ": "推理/训练中 NPU 整体利用率较低：trace 里大量 aclrtSynchronizeStreamWithTimeout 等同步接口，同步调用期间没有任何其他算子下发，异步下发被打断", "COMMON-SYSCALL-THP": "训练前 500 步性能正常，保存 Checkpoint 后性能下降 20%+ 再缓慢恢复：30GB 量级 D2H 拷贝长期占用 Host 内存，触发内核内存回收与重整，malloc/free 耗时显著增长；透明大页（THP）后台合并进一步抢占训练进程 CPU", "COMMON-EMBEDDING-BWD-EMPTY": "训练 loss NaN（首个 NaN 在 embedding/wte 层梯度）：embedding 反向输入为空时返回默认内存中的未初始化数据——触发源 A：dsp 序列切分致部分卡无 token；触发源 B：数据标注越界致 gt_labels 为空（早期 CANN <8.0.0）", "COMMON-FA-RACE-DETERMINISM": "80 卡大规模训练结果确定性无法固定：CANN 8.1.0 RC1 的 Flash Attention 算子内部数据搬迁前后缺少同步机制（数据竞争），8.0.0 RC4 无此问题", "COMMON-FSDP-OFFLOAD-SYNC-NAN": "MOVA 模型训练 NaN：offload 场景下 FSDP post_backward / foreach_reduce 前后的流同步缺失，.to() 前后的数据搬运时序异常（加同步后问题消失）", "COMMON-RMSNORM-WEIGHT-SCALE": "Gemma 加载权重后重复训练 Loss 差异偏大、grad_norm 异常偏大：加载的 RMSNorm 权重数值异常放大（数值每经一层 RMSNorm 放大约百倍，深层尤甚），随机初始化时正常", "COMMON-SEED-RESET-DETERMINISM": "Qwen2.5-omni 重复训练 loss 与 grad_norm 不一致：业务代码自定义 fix_randn 装饰器内重复调用无参 seed_all()（未带 mode=True），把 torch.use_deterministic_algorithms(True) 重置为 False，aclnn 算子 deter…", "COMMON-TP-SEED-UNSYNCED": "Qwen-Image-Edit 基于 Megatron 在 NPU 上 TP8 推理，跑多个请求时第 3 张生成图必然花图：TP 组内随机种子未同步——0 卡作通信主卡的 random 调用次数与其他卡不同", "VERL-5074": "verl GRPO 启动 A2 报 HCCL error code 5（hcclCommInitRootInfoConfig, RuntimeError: create_config）：runtime_env.yaml 的 HCCL_HOST_SOCKET_PORT_RANGE/HCCL_NPU_SOCKET_PORT…", "VERL-6608": "verl GRPO TP2（npu 上 qwen 4B VL）报 HCCL error code 7（hcclCommInitRootInfoConfig）：HDK 版本与 verl 镜像组合不兼容，换 HDK     else if (k === 'html') n.innerHTML = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);

/* 哑铃图：每行一条 p50→p90 的量程线 + 两点；右端才是"该设超时"要看的那一头 */
function dumbbell(rows, { w = 380, rowH = 27, padL = 96, padR = 52 } = {}) {
  const h = rows.length * rowH + 18;
  // 对数轴：工具耗时跨三个数量级（几十毫秒到十几秒），线性轴会把除最慢以外全压成一个点。
  const vals = rows.flatMap(r => [r.p50 || 1, r.p90 || 1]).filter(v => v > 0);
  const lo = 20, hi = Math.max(20000, Math.max(...vals) * 1.2);
  const x = v => padL + (Math.log10(Math.max(v, lo) / lo) / Math.log10(hi / lo)) * (w - padL - padR);
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
  svg.setAttribute('width', '100%');
  svg.style.height = h + 'px';
  const add = (tag, a) => {
    const n = document.createElementNS('http://www.w3.org/2000/svg', tag);
    for (const [k, v] of Object.entries(a)) n.setAttribute(k, v);
    svg.append(n); return n;
  };
  add('line', { x1: padL, y1: 0, x2: padL, y2: h - 16, class: 'ax' });
  [100, 1000, 10000].filter(v => v >= lo && v <= hi).forEach(v => {
    add('line', { x1: x(v), y1: 0, x2: x(v), y2: h - 16, stroke: 'var(--line)', 'stroke-width': 1,
                  'stroke-dasharray': '2 3' });
    add('text', { x: x(v), y: h - 3, class: 'tick', 'text-anchor': 'middle' }).textContent = ms(v);
  });
  rows.forEach((r, i) => {
    const cy = 10 + i * rowH;
    add('text', { x: padL - 10, y: cy + 4, 'text-anchor': 'end', class: 'tick',
                  style: 'font-family:var(--mono);font-size:11px;fill:var(--ink-2)' })
      .textContent = r.tool;
    add('line', { x1: x(r.p50), y1: cy, x2: x(r.p90), y2: cy, stroke: 'var(--signal)',
                  'stroke-width': 2, 'stroke-linecap': 'round', opacity: .45 });
    add('circle', { cx: x(r.p50), cy, r: 3, fill: 'var(--signal)' });
    add('rect', { x: x(r.p90) - 3.4, y: cy - 3.4, width: 6.8, height: 6.8, fill: 'var(--signal)',
                  transform: `rotate(45 ${x(r.p90)} ${cy})` });
    const lab = add('text', { x: w - padR + 8, y: cy + 4, class: 'tick' });
    lab.textContent = r.calls + ' 次';
  });
  return svg;
}

/* 堆叠条：一份占比条 + 图例 */
function stacked(parts, { w = 380, h = 22 } = {}) {
  const total = parts.reduce((s, p) => s + p.value, 0) || 1;
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
  svg.setAttribute('width', '100%'); svg.style.height = h + 'px';
  let cx = 0;
  parts.forEach(p => {
    const bw = p.value / total * w;
    const r = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    for (const [k, v] of Object.entries({ x: cx, y: 0, width: Math.max(0, bw - 1.5), height: h,

      t.setAttribute('style', 'font:10.5px var(--sans);fill:#fff;opacity:.95');
      t.textContent = Math.round(p.value / total * 100) + '%';
      svg.append(r, t);
    } else svg.append(r);
    cx += bw;
  });

}

      el('div', { class: 'note', html: `距今 ${h.freshness?.live_age_days ?? '—'} 天 · 超期 ${h.freshness?.live_limit_days ?? 7} 天` })]),

  /* 本期该做什么 + 右侧状态 */
  // 同因合并：诊断侧与结构侧的新鲜度是同一个原因（周界没组期），合成一条，并列写出两侧
  const seen = new Set();
  const merged = [];
  fails.filter(f => f.face !== '数字可信度').forEach(f => {
    const key = f.face === '数据新鲜度' ? 'freshness' : f.face + '|' + f.text.slice(0, 24);
    if (seen.has(key)) { merged[merged.length - 1].both = true; return; }
    seen.add(key); merged.push(Object.assign({}, f));
  });
  const todoRows = merged.slice(0, 5).map((f, i) => el('li', {}, [
    el('div', { class: 'idx' }, String(i + 1)),
    el('div', {}, [
      el('div', { class: 't' }, (f.plain || f.text.split('——')[0]) + (f.both ? '（诊断侧与结构侧同时超期）' : '')),
      el('div', { class: 'why' }, f.face + ' · ' + f.text.replace(/^.*——/, '').slice(0, 90)),
      f.action ? el('code', {}, f.action.length > 64 ? f.action.slice(0, 62) + '…' : f.action) : null,
    ]),
    el('div', { class: 'sev' }, [el('span', { class: 'dot bad' }), '越界']),
  ]));

  wrap.append(el('div', { class: 'grid' }, [
    el('section', { class: 'c7' }, [
      el('h2', {}, ['本期该做什么', el('span', { class: 'cnt' }, `${fails.length} 项判据被违反`),
        el('span', { class: 'right' }, el('span', { class: 'hint' }, '按代价排序'))]),
      el('ol', { class: 'todo' }, todoRows),
    ]),
    el('aside', { class: 'c5' }, [
      el('div', { class: 'block' }, [
        el('h2', {}, ['不可解读', el('span', { class: 'cnt' }, `${unread.length} 项`)]),
        ...unread.map(f => el('div', { class: 'row' }, [
          el('span', { class: 'n', html: esc(f.plain?.split('现在不可解读')[0] || f.text.split('：')[0]) }),
          el('span', { class: 'tag bad' }, '无分母'),
          el('span', { class: 'why' }, (f.plain || '').slice(0, 80)),
        ])),
      ]),
      el('div', { class: 'block' }, [
        el('h2', {}, ['需处理', el('span', { class: 'cnt' }, `${warns.length} 项提示`)]),
        ...warns.slice(0, 3).map(f => el('div', { class: 'row' }, [
          el('span', { class: 'n', html: esc(f.text.split('：')[0].slice(0, 26)) }),
          el('span', { class: 'tag warn' }, '待查'),
        ])),
        warns.length === 0 ? el('div', { class: 'hint', style: 'padding:6px 0' }, '本轮没有待查提示。') : null,
        warns.length > 3 ? el('div', { class: 'row' }, [el('span', { class: 'why' }, `其余 ${warns.length - 3} 项`), el('span', {})]) : null,
      ]),
      el('div', { class: 'block' }, [
        el('h2', {}, ['读数强度', el('span', { class: 'cnt' }, `${Object.keys(DATA.timeline.strength || {}).length} 个指标`)]),
        ...(() => {
          const st = DATA.timeline.strength || {};
          const c = { 确定性: 0, 代理: 0, 自报: 0, 人工: 0 };
          Object.values(st).forEach(v => { if (c[v] !== undefined) c[v] += 1; });
          const parts = [
            { label: '确定性', value: c['确定性'], color: 'var(--line-2)' },
            { label: '代理', value: c['代理'], color: SIG[2] },
            { label: '自报', value: c['自报'], color: SIG[0] },
            { label: '人工', value: c['人工'], color: SIG[1] },
          ];
          return [stacked(parts, { h: 18 }),
            el('div', { class: 'legend', style: 'margin-top:8px' }, parts.map(x => el('span', {}, [el('i', { style: `background:${x.color}` }), `${x.label} ${x.value}`]))),
            el('div', { class: 'hint', style: 'margin-top:8px;line-height:1.55' },
              '「自报」是 agent 自己记的判断，只作趋势与异常信号；「人工」只有现场能刷新。')];
        })(),
      ]),
    ]),
  ]));

  /* 条目使用两榜 + 工具分布 */
  const cases = [...g.cases].sort((a, b) => (b.selected + b.resolved) - (a.selected + a.resolved));
  const maxSel = Math.max(...cases.map(c => c.selected), 1);
  const refs = [...g.refs].sort((a, b) => b.lookups - a.lookups);
  const maxLk = Math.max(...refs.map(r => r.lookups), 1);
  let mode = 'week';
  const rankBox = el('div');
  const renderRank = () => {
    rankBox.innerHTML = '';
    const rows = mode === 'week' ? cases.slice(0, 9) : cases.slice(0, 9);
    const tb = el('tbody');
    rows.forEach((c, i) => {
      const v = mode === 'week' ? c.selected : (c.loaded + c.resolved + c.misdiagnosed + c.excluded + c.selected);
      const mx = mode === 'week' ? maxSel : Math.max(...cases.map(x => x.selected + x.loaded + x.excluded), 1);
      const t = shortTitle(c.id);
      tb.append(el('tr', {}, [
        el('td', { style: 'width:22px;color:var(--ink-3);font-family:var(--serif)' }, String(i + 1)),
        el('td', {}, [el('div', { class: 'id' }, esc(c.id)),
          t ? el('div', { class: 'ti', title: t }, esc(t)) : null]),
        el('td', { class: 'barcell' }, bar(v, mx)),
        el('td', { class: 'r' }, el('span', { class: 'ct' }, String(v))),
        el('td', { class: 'r', style: 'width:86px' }, c.baseline
          ? el('span', { class: 'tag mute' }, '基线')
          : el('span', { class: 'hint' }, c.last_hit || (Object.keys(c.by_week || {}).sort().pop() || '—'))),
      ]));
    });
    rankBox.append(el('table', { class: 'rank' }, [
      el('thead', {}, el('tr', {}, [
        el('th', {}, '#'), el('th', {}, '条目'),
        el('th', { class: 'barcell' }, mode === 'week' ? '本期被选中' : '累计触达'),
        el('th', { class: 'r' }, '计数'), el('th', { class: 'r' }, '最后 / 标签'),
      ])),
      tb,
    ]));
  };
  renderRank();

  // 等人工（ask_user_question）与等后台任务（job_output / job_kill）的耗时不与模型动作同尺度：
  // 它们记的是"人在想 / 任务在跑"，拉进同一个量程会把其它工具压成一条线。分开报。
  const WAIT = new Set(['ask_user_question', 'job_output', 'job_kill']);
  const actRows = DATA.detail.tool_rows.filter(t => !WAIT.has(t.tool));
  const waitRows = DATA.detail.tool_rows.filter(t => WAIT.has(t.tool));
  const toolRows = actRows.slice(0, 8);
  const waitNote = waitRows.length
    ? '另有 ' + waitRows.map(t => `${t.tool} ${t.calls} 次（p50 ${ms(t.p50)}）`).join('、') + ' —— 等的是人或后台任务，单独计'
    : '';
  wrap.append(el('div', { class: 'grid' }, [
    el('section', { class: 'c7' }, [
      el('h2', {}, ['条目使用', el('span', { class: 'right' },
        el('div', { class: 'seg' }, [
          el('button', { 'aria-pressed': 'true', onclick: e => { mode = 'week'; e.target.parentNode.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', 'false')); e.target.setAttribute('aria-pressed', 'true'); renderRank(); } }, '本期增量'),
          el('button', { 'aria-pressed': 'false', onclick: e => { mode = 'total'; e.target.parentNode.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', 'false')); e.target.setAttribute('aria-pressed', 'true'); renderRank(); } }, '跨期累计'),
        ]))]),
      rankBox,
      el('div', { class: 'legend', style: 'margin-top:14px' },
        [`本轮覆盖 ${g.cases.length} 条案例 · 其中 ${g.cases.filter(c => c.baseline).length} 条只有搬运行（历史累计，不计本期增量）`]),
    ]),
    el('section', { class: 'c5' }, [
      el('h2', {}, ['工具分布', el('span', { class: 'hint' }, '圆点 p50 · 菱形 p90 · 按 p90 排序')]),
      dumbbell(toolRows),
      el('div', { class: 'legend' }, [
        el('span', {}, [el('i', { style: 'background:var(--signal)' }), 'p50']),
        el('span', {}, [el('i', { style: 'background:var(--signal);opacity:.45' }), 'p50→p90 量程']),
        el('span', { class: 'hint' }, `其余 ${Math.max(0, actRows.length - 8)} 个动作省略`),
      ]),
      waitNote ? el('div', { class: 'hint', style: 'margin-top:8px;line-height:1.55' }, waitNote) : null,
    ]),
  ]));

  /* 过程动作成本 / 变差的读数 / 长期零选中 */
  const byTool = {};
  (actRows || []).forEach(t => { byTool[t.tool] = (t.calls * t.p50); });
  const parts = Object.entries(byTool).sort((a, b) => b[1] - a[1]).slice(0, 5)
    .map(([k, v], i) => ({ label: k, value: v, color: SIG[i] }));
  const rest = Object.values(byTool).reduce((s, v) => s + v, 0) - parts.reduce((s, p) => s + p.value, 0);
  if (rest > 0) parts.push({ label: '其余', value: rest, color: SIG[5] });

  wrap.append(el('div', { class: 'grid' }, [
    el('section', { class: 'c5' }, [
      el('h2', {}, ['过程动作成本', el('span', { class: 'hint' }, '按调用次数 × p50 折算')]),
      (() => {
        const max = Math.max(...parts.map(p => p.value), 1);
        return el('div', {}, parts.map((p, i) => el('div', { class: 'cost' }, [
          el('span', { class: 'cl', style: 'font-family:var(--mono);font-size:11.5px' }, p.label),
          el('span', { class: 'cb' }, el('i', { style: `width:${Math.max(2, p.value / max * 100)}%;background:${p.color}` })),
          el('span', { class: 'cv' }, ms(p.value)),
        ])));
      })(),
    ]),
    el('section', { class: 'c4' }, [
      el('h2', {}, ['变差的读数']),
      ...[
        ['兜底视图读入', '24,270 tok', '硬线 20,000', '按平台轴切分或改两步法'],
        ['interrupt 类视图', '16,442 tok', '软线 8,000', '先瘦身行宽与字段'],
        ['live 快照', '38 天', '上限 7 天', '周界补一次组装'],
      ].map(([n, v, th, act]) => el('div', { class: 'mini' }, [
        el('span', { class: 'lab' }, n),
        el('span', { class: 'val', html: `${v} <span style="color:var(--bad)">/ ${th}</span>` }),
        el('span', { class: 'hint', style: 'grid-column:1/-1' }, act),
      ])),
    ]),
    el('section', { class: 'c3' }, [
      el('h2', {}, ['长期零选中']),
      el('div', { class: 'big', html: `${g.cold.cases}<small>条案例</small>` }),
      el('div', { class: 'hint', style: 'margin-top:10px;line-height:1.6' },
        '本期与跨期都没被选中过。按检索覆盖判断，不据此退休——「没人查」可能只是词面与症状不接头。'),
    ]),
  ]));

  /* 结局覆盖：把"哪些数不能当证据"做成图，而不是只写一句不可解读 */
  const withResolved = g.cases.filter(c => c.resolved > 0).length;
  const withMis = g.cases.filter(c => c.misdiagnosed > 0).length;
  const onlyTouched = g.cases.filter(c => !c.resolved && !c.misdiagnosed && !c.self_resolved).length;
  wrap.append(el('div', { class: 'grid' }, [
    el('section', { class: 'c12' }, [
      el('h2', {}, ['结局覆盖', el('span', { class: 'hint' }, '误诊率与归因比为什么不可解读')]),
      el('div', { class: 'funnel' }, [
        el('div', { class: 'fr' }, [el('span', { class: 'fl' }, '被触达过'), bar3(g.cases.length, g.cases.length, `${g.cases.length} 条`), el('span', { class: 'fn' }, '本轮有选中/加载/排除')]),
        el('div', { class: 'fr' }, [el('span', { class: 'fl' }, '有解决记录'), bar3(withResolved, g.cases.length, `${withResolved} 条`, true), el('span', { class: 'fn' }, '现场回报确认')]),
        el('div', { class: 'fr' }, [el('span', { class: 'fl' }, '有误诊记录'), bar3(withMis, g.cases.length, `${withMis} 条`, true), el('span', { class: 'fn' }, '回报没解决')]),
      ]),
      el('div', { class: 'hint', style: 'margin-top:6px;line-height:1.6' },
        `${onlyTouched} 条只有触达、没有结局：分母是 0，所以误诊率与归因比写「不可解读」，不写 0——没数据不等于没问题。`),
    ]),
  ]));

  function bar3(v, max, label, warn) {
    const w = max ? Math.max(v / max * 100, v === 0 ? 0 : 3) : 0;
    return el('div', { class: 'fb' + (v === 0 ? ' z' : ''), style: `width:${w}%`, title: label }, label);
  }

  return wrap;
}

/* ---------------- 诊断 tab ---------------- */
function viewDiagnosis() {
  const d = DATA.detail, S = DATA.generated;
  const wrap = el('div', { class: 'split' });

  /* 左：会话列表 */
  const list = el('aside', { class: 'sessions' });
  DATA.sessions.forEach((s) => {
    const cur = s.id === DATA.session;
    list.append(el('div', {
      class: 's', 'aria-current': cur ? 'true' : 'false',
      onclick: () => { alert(`设计稿内嵌了 ${d.session} 的完整明细；其余会话只展示汇总（本机明细存在，但这份 demO 只内联一条）。`); },
    }, [
      el('span', { class: 'dot ' + (s.status === 'resolved' ? 'ok' : s.status === 'escalated' ? 'warn' : 'mute'),
                   style: 'margin-top:5px' }),
      el('div', {}, [
        el('div', { class: 'id' }, esc(s.id)),
        el('div', { class: 'm' }, `${s.platform || '—'} · ${s.category || '—'} · ${s.steps ?? '—'} 步`),
        el('div', { class: 'st' }, [
          el('span', { class: 'tag ' + (s.strength === 'self-report' ? 'warn' : 'mute') }, s.strength || '—'),
          s.tools ? el('span', { class: 'tag mute' }, `${s.tools} 次调用`) : null,
        ]),
      ]),
    ]));
  });

  /* 右：单次诊断 */
  const right = el('section');

  right.append(el('div', { class: 'conclusion' }, [
    el('div', {}, [el('div', { class: 'k' }, '结论强度'), el('div', { class: 'v' }, [el('span', { class: 'tag sig' }, d.strength)])]),
    el('div', {}, [el('div', { class: 'k' }, '状态'), el('div', { class: 'v' }, `进行中 · ${d.stop_reason}`)]),
    el('div', {}, [el('div', { class: 'k' }, '命中'), el('div', { class: 'v' }, '未命中（3 条候选全排除）')]),
    el('div', {}, [el('div', { class: 'k' }, '沉淀'), el('div', { class: 'v num' }, `${d.sediment} 条候选`)]),
    el('div', {}, [el('div', { class: 'k' }, '回报'), el('div', { class: 'v' }, `${d.feedback.outcome} · ${d.feedback.case}`)]),
    el('div', {}, [el('div', { class: 'k' }, '工具调用'), el('div', { class: 'v num' }, `${(d.tool_rows.reduce((a, t) => a + t.calls, 0))} 次`)]),
    el('div', {}, [el('div', { class: 'k' }, 'token'), el('div', { class: 'v num', html: compact(d.tokens.uncached + d.tokens.cache_read + d.tokens.out) })]),
    el('div', {}, [el('div', { class: 'k' }, '报告'), el('div', { class: 'v mono', style: 'font-size:11.5px;word-break:break-all' }, d.report)]),
  ]));
  right.append(el('div', { class: 'lede' }, d.summary_short + '…'));

  /* 各步：一条步轨（1→6），节点上是这一步的动作；没有事件的步留空节点，不假装它发生过 */
  const STEP_NAME = { 1: '收集与路由', 2: '键触发 + 背景', 3: '候选加载与验证', 4: '现场探询', 5: '深度排查', 6: '结论与沉淀' };
  const STEP_SHORT = { 1: '路由', 2: '键触发', 3: '候选验证', 4: '探询', 5: '深度排查', 6: '结论' };
  const byStep = Object.fromEntries(d.steps.map(x => [x.step, x]));
  const maxAct = Math.max(...d.steps.map(x => x.actions.length), 1);
  const rail = el('div', { class: 'rail' }, [1, 2, 3, 4, 5, 6].map(n => {
    const x = byStep[n];
    return el('div', { class: 'node ' + (x ? 'has' : 'gap') }, [
      el('div', { class: 'n' }, x ? String(n) : '·'),
      el('div', { class: 'nm' }, STEP_NAME[n]),
      el('div', { class: 'nb' }, el('i', { style: `width:${x ? Math.max(4, x.actions.length / maxAct * 100) : 0}%` })),
      el('div', { class: 'nc' }, x ? `${x.actions.length} 动作` : '无事件'),
      el('div', { class: 'na' }, x ? x.actions.slice(0, 3).map(a => el('span', { class: 'tag mute' }, a)) : []),
    ]);
  }));
  const stepCost = d.step_cost || null;
  const costBox = (() => {
    if (!stepCost || stepCost.length === 0) {
      return el('div', { class: 'hint', style: 'margin-top:14px;line-height:1.6;max-width:78ch' },
        '这条会话没有每步成本：轨迹的事件没带 `ts`，切不出时间窗。不按事件顺序硬猜——猜错会把耗时挂到相邻步上，比没有更坏。');
    }
    const maxMs = Math.max(...stepCost.map(r => r.ms), 1);
    const maxTok = Math.max(...stepCost.map(r => (r.tokens.uncached + r.tokens.cache_read + r.tokens.out)), 1);
    const totalMs = stepCost.reduce((a, r) => a + r.ms, 0);
    const totalTok = stepCost.reduce((a, r) => a + r.tokens.uncached + r.tokens.cache_read + r.tokens.out, 0);
    const worst = stepCost.slice().sort((a, b) => b.ms - a.ms)[0];
    return el('div', {}, [
      el('div', { class: 'wfhead' }, [
        el('span', { class: 'num', html: `${(totalMs / 1000).toFixed(1)}<small>s 工具耗时</small>` }),
        el('span', { class: 'num', html: `${compact(totalTok)}<small>token</small>` }),
        el('span', { class: 'hint', html: `最贵的一步是步 ${worst.step}（${(worst.ms / 1000).toFixed(1)}s、${worst.calls} 次调用）` }),
      ]),
      el('div', { class: 'wf' }, stepCost.map(r => {
        const tok = r.tokens.uncached + r.tokens.cache_read + r.tokens.out;
        return el('div', { class: 'wfrow' }, [
          el('div', { class: 'wfl' }, [el('span', { class: 'wfn num' }, String(r.step)), el('span', {}, STEP_SHORT[r.step] || '')]),
          el('div', { class: 'wfb' }, [
            el('div', { class: 'ms' }, [el('i', { style: `width:${Math.max(1, r.ms / maxMs * 100)}%` })]),
            el('div', { class: 'tk' }, [el('i', { style: `width:${Math.max(1, tok / maxTok * 100)}%` })]),
          ]),
          el('div', { class: 'wfv' }, [
            el('b', {}, r.ms >= 1000 ? (r.ms / 1000).toFixed(1) + 's' : r.ms + 'ms'),
            el('span', { html: `${r.calls} 次 · ${compact(tok)} tok` }),
          ]),
        ]);
      })),
      el('div', { class: 'hint', style: 'margin-top:10px;line-height:1.6;max-width:82ch' },
        '耗时与 token 都来自会话账单，按每步第一个事件的 `ts` 切窗口：落在窗口里的工具调用耗时相加、usage 累加。' +
        '细条是 token 的相对量；窗口切不出来就整段不显示，不给估值。'),
    ]);
  })();
  const stepBox = el('section', { class: 'grid' }, [el('div', { class: 'c12' }, [
    el('h2', {}, ['各步成本', el('span', { class: 'hint' }, '节点圆点=有事件的诊断步；虚线=这一步在轨迹里没有事件（不补）')]),
    rail,
    costBox,
  ])]);

  right.append(stepBox);

  /* 检索 */
  const r = d.retrieval;
  const hitN = 0;
  const nIdx = r.load_index_cases || 0;
  const nCand = (r.candidates || []).length;
  const nHit = (r.checks || []).filter(x => x.result === 'match').length;
  const funnel = el('div', { class: 'funnel' }, [
    el('div', { class: 'fr' }, [el('span', { class: 'fl' }, '类视图条目'), bar2(nIdx, nIdx, String(nIdx)), el('span', { class: 'fn' }, 'inference/vllm-ascend × interrupt')]),
    el('div', { class: 'fr' }, [el('span', { class: 'fl' }, '进候选'), bar2(nCand, nIdx, String(nCand)), el('span', { class: 'fn' }, '按 sig/tok 收敛')]),
    el('div', { class: 'fr' }, [el('span', { class: 'fl' }, '命中'), bar2(nHit, nIdx, String(nHit), nHit === 0), el('span', { class: 'fn' }, nHit === 0 ? '全排除 → 转流程' : '命中')]),
  ]);
  function bar2(v, max, label, zero) {
    const w = max ? Math.max(v / max * 100, v === 0 ? 0 : 2) : 0;
    return el('div', { class: 'fb' + (zero ? ' z' : ''), style: `width:${w}%` }, label);
  }

  right.append(el('section', { class: 'grid' }, [
    el('div', { class: 'c7' }, [
      el('h2', {}, ['检索', el('span', { class: 'hint' }, '两阶段加载与先验三态')]),
      funnel,
      el('h3', { style: 'margin:16px 0 6px' }, '被排除的候选'),
      el('div', {}, r.excluded.map(id => el('div', { class: 'mini' }, [
        el('span', { class: 'lab mono' }, id),
        el('span', { class: 'val' }, 'selected 3 · loaded 2 · excluded 1'),
      ]))),
    ]),
    el('div', { class: 'c5' }, [
      el('h2', {}, ['先验消费', el('span', { class: 'hint' }, `${r.refs.length} 次查询`)]),
      el('div', { class: 'refs' }, r.refs.map(x => el('div', { class: 'r' }, [
        el('span', { class: 'mono', style: 'font-size:11.5px' }, (x.ids || []).join(', ') || '—'),
        el('span', { class: 'tag ' + (x.outcome === 'hit' ? 'ok' : x.outcome === 'miss' ? 'warn' : 'mute') }, x.outcome || '未记'),
        el('span', { class: 'hint' }, x.purpose || ''),
      ]))),
    ]),
  ]));

  /* 成本 */
  const tok = d.tokens, ir = d.index_read || {};
  const tokParts = [
    { label: '缓存读', value: tok.cache_read, color: SIG[0] },
    { label: '未缓存输入', value: tok.uncached, color: SIG[1] },
    { label: '输出', value: tok.out, color: SIG[2] },
    { label: '缓存写', value: tok.cache_write || 0.0001, color: SIG[3] },
  ];
  const irRows = [
    ['类视图', ir.class_view, '16,442 tok 的 interrupt 类视图'],
    ['兜底视图', ir.fallback_view, '本次没读（category 已判出）'],
    ['先验层', ir.reference_layer, '4 条词条正文'],
    ['阶段二候选', ir.candidates_full, '3 条候选全文'],
  ];
  const irMax = Math.max(...irRows.map(x => x[1] || 0), 1);
  right.append(el('section', { class: 'grid' }, [
    el('div', { class: 'c6' }, [
      el('h2', {}, ['成本', el('span', { class: 'hint' }, 'token 四类 · 读入账四分项')]),
      stacked(tokParts, { h: 26 }),
      el('div', { class: 'legend' }, tokParts.map(p => el('span', {}, [el('i', { style: `background:${p.color}` }), `${p.label} ${compact(p.value)}`]))),
      el('h3', { style: 'margin:16px 0 8px' }, '一次诊断的读入账'),
      el('div', {}, irRows.map(([n, v, why]) => el('div', { class: 'mini' }, [
        el('span', { class: 'lab' }, n),
        el('span', { class: 'val' }, v == null ? '本次没读' : fmt(v) + ' tok'),
        v == null ? el('span', { class: 'hint', style: 'grid-column:1/-1' }, why) : el('span', { style: 'grid-column:1/-1' }, bar(v, irMax)),
      ]))),
    ]),
    el('div', { class: 'c6' }, [
      el('h2', {}, ['最慢的调用', el('span', { class: 'hint' }, d.window_calls
        ? `诊断窗口内 ${d.window_calls.in_window} 次（全会话 ${d.window_calls.total} 次）`
        : '一次一条，含参数摘要')]),
      el('div', {}, d.slowest.map(c => el('div', { class: 'mini' }, [
        el('span', { class: 'lab' }, [el('span', { class: 'tag ' + (c.ok ? 'mute' : 'bad') }, c.tool), '  ',
          el('span', { class: 'mono', style: 'font-size:11px;color:var(--ink-3)' }, c.args || '')]),
        el('span', { class: 'val' }, ms(c.ms)),
      ]))),
      el('h3', { style: 'margin:18px 0 6px' }, d.step_cost ? '测量的边界' : '本次没记'),
      ...(d.step_cost ? [
        el('div', { class: 'mini' }, [el('span', { class: 'lab' }, '「耗时」= 调用到返回'), el('span', { class: 'val' }, '含并行等待')]),
        el('div', { class: 'hint', style: 'margin-top:6px;line-height:1.6' },
          '同一轮里并行发的多个调用，返回时间可能被推后，所以这是「占用墙钟」的上界，不是 CPU 时间。' +
          '模型思考的时间不计入任何一步——所以各步之和会小于诊断的总墙钟。'),
      ] : [
        el('div', { class: 'mini' }, [el('span', { class: 'lab' }, '每步成本'), el('span', { class: 'tag mute' }, '未记')]),
        el('div', { class: 'hint', style: 'margin-top:6px' },
          '轨迹的事件没带 `ts`，切不出时间窗。会话日志按 harness 轮次计、轨迹按诊断步计，' +
          '两套编号不同源；按编号关联会把耗时挂到别的动作上，所以留空。'),
      ]),
    ]),
  ]));

  wrap.append(list, right);
  return wrap;
}

/* ---------------- 挂载 ---------------- */
let tab = 'metrics';
const view = $('#view');
const render = () => {
  view.innerHTML = '';
  view.append(tab === 'metrics' ? viewMetrics() : viewDiagnosis());
  $('#tab-metrics').setAttribute('aria-selected', tab === 'metrics');
  $('#tab-diag').setAttribute('aria-selected', tab === 'diag');
  $('#tabsMeta').textContent = tab === 'metrics'
    ? `${DATA.generated.covered.deployment} · ${DATA.timeline.periods.length} 期 · ${DATA.generated.cases.length} 条案例`
    : `${DATA.sessions.length} 个诊断会话 · 明细取自 ${DATA.session}`;
};
$('#tab-metrics').onclick = () => { tab = 'metrics'; render(); };
$('#tab-diag').onclick = () => { tab = 'diag'; render(); };
$('#dep').textContent = DATA.generated.covered.deployment;
$('#footSid').textContent = DATA.session;
$('#theme').onclick = () => {
  const cur = document.documentElement.getAttribute('data-theme');
  document.documentElement.setAttribute('data-theme', cur === 'dark' ? 'light' : 'dark');
};
if (/dark/.test(location.hash)) document.documentElement.setAttribute('data-theme', 'dark');
tab = /diag/.test(location.hash) ? 'diag' : 'metrics';
render();
</script>
</body>
</html>
