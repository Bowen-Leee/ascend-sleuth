<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>诊断面板方案 · 保留轨迹信息量 + 呈现诊断指标</title>
<style>
:root{
  --paper:#f7f4ee; --paper-2:#f1ede4; --card:#fbf9f5;
  --ink:#1a1713; --ink-2:#5d564b; --ink-3:#8d8577;
  --line:#e2dccd; --line-2:#cfc7b4;
  --signal:#b3401f; --signal-soft:rgba(179,64,31,.09);
  --good:#2f6f4a; --warn:#8a6410; --bad:#a32b22; --mute:#7c7568;
  --serif:"Charter","Iowan Old Style","Songti SC",Georgia,serif;
  --sans:"Avenir Next","PingFang SC","Hiragino Sans GB","Helvetica Neue",sans-serif;
  --mono:"SF Mono",ui-monospace,Menlo,monospace;
}
html[data-theme=dark]{
  --paper:#14130f; --paper-2:#1a1814; --card:#1d1b16;
  --ink:#f2eee4; --ink-2:#b3ac9d; --ink-3:#7e776a;
  --line:#2b2822; --line-2:#3b372e;
  --signal:#e0703f; --signal-soft:rgba(224,112,63,.13);
  --good:#67b68c; --warn:#d6a44a; --bad:#e06a5e; --mute:#8b8477;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.6 var(--sans);-webkit-font-smoothing:antialiased;padding-bottom:90px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
h1,h2,h3{margin:0;font-weight:600}
.num{font-family:var(--serif);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.mono{font-family:var(--mono);font-size:.92em}
.hint{font-size:11.5px;color:var(--ink-3)}
.tag{display:inline-block;font-size:10px;letter-spacing:.04em;padding:1px 5px;border-radius:4px;border:1px solid currentColor;white-space:nowrap}
.tag.mute{color:var(--mute)}.tag.ok{color:var(--good)}.tag.warn{color:var(--warn)}
.tag.bad{color:var(--bad)}.tag.sig{color:var(--signal)}

.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--paper) 94%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .in{max-width:1280px;margin:0 auto;padding:11px 24px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.mark{font-family:var(--serif);font-size:17px}
.mark em{font-style:normal;color:var(--signal)}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:999px;padding:2px;gap:2px;background:var(--card)}
.seg button{font-size:12px;padding:3px 11px;border-radius:999px;color:var(--ink-3);white-space:nowrap}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--paper)}
.grow{flex:1}
.note{max-width:1280px;margin:0 auto;padding:9px 24px 0;font-size:12.5px;color:var(--ink-2)}
.note b{color:var(--ink)}
.stage{max-width:1280px;margin:0 auto;padding:16px 24px 0}

/* ---- 轨迹事件 ---- */
.step{margin-bottom:26px;scroll-margin-top:96px}
.step-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:10px;
        padding-bottom:7px;border-bottom:1px solid var(--line-2)}
.step-h .n{font-family:var(--serif);font-size:19px}
.step-h .nm{font-size:13.5px}
.step-h .cost{margin-left:auto;display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;color:var(--ink-2)}
.step-h .cost .cb{width:86px;height:8px;background:var(--paper-2);border-radius:2px;overflow:hidden}
.step-h .cost .cb i{display:block;height:100%;background:var(--signal)}
.ev{border-left:2px solid var(--line);padding:2px 0 2px 14px;margin-bottom:14px}
.ev.user{border-left-color:var(--ink-3)}
.ev.agent{border-left-color:var(--signal)}
.ev-h{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:5px}
.ev-h .who{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.ev-h .act{font-family:var(--mono);font-size:11.5px;color:var(--ink-2);background:var(--paper-2);
           border:1px solid var(--line);border-radius:4px;padding:0 5px}
.ev p{margin:0 0 7px;line-height:1.72;max-width:80ch}
.ev p.q{font-size:13.5px}
.ev .reason{font-size:12.5px;color:var(--ink-2);line-height:1.65;max-width:80ch;
            border-left:2px solid var(--line-2);padding-left:10px;margin:6px 0 8px}
.ev .reason b{color:var(--ink-3);font-weight:500;font-size:11px;letter-spacing:.06em;text-transform:uppercase;display:block;margin-bottom:3px}
.ev .tc{margin:8px 0 0;padding:0;list-style:none;font-family:var(--mono);font-size:11px;
        color:var(--ink-2);background:var(--paper-2);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
.ev .tc li{padding:2px 0;line-height:1.5;word-break:break-all}
.ev .tc li::before{content:"› ";color:var(--signal)}
.ev details{margin-top:7px}
.ev details summary{font-size:11.5px;color:var(--ink-2);cursor:pointer;list-style:none}
.ev details summary::before{content:"▸ ";color:var(--ink-3)}
.ev details[open] summary::before{content:"▾ "}
.ev details .evd{font-size:12px;color:var(--ink-2);line-height:1.7;padding:7px 0 0 10px;border-left:1px dashed var(--line-2)}
.ev details .evd .k{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-top:6px}
.ev details .evd ul{margin:2px 0 0;padding-left:16px}

/* ---- E：脊柱 ---- */
.E{max-width:860px}
.E .spine{display:grid;grid-template-columns:44px 1fr;gap:0}
.E .gutter{position:relative}
.E .gutter::before{content:"";position:absolute;left:21px;top:6px;bottom:6px;width:1px;background:var(--line-2)}
.E .gutter i{position:absolute;left:14px;width:15px;height:15px;border-radius:50%;background:var(--paper);
             border:2px solid var(--signal);z-index:1}
.E .gutter b{position:absolute;left:26px;font:10px var(--mono);color:var(--ink-3);white-space:nowrap}

/* ---- F/H：双栏 ---- */
.F{display:grid;grid-template-columns:minmax(0,1fr) 292px;gap:26px;align-items:start}
.rail{position:sticky;top:88px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
.rail h3{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin-bottom:8px}
.rail .kpi{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px;margin-bottom:12px}
.rail .kpi .k{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.rail .kpi .v{font-family:var(--serif);font-size:17px;line-height:1.2}
.rail .kpi .v small{font-family:var(--sans);font-size:10px;color:var(--ink-3);margin-left:2px}
.rail .srow{display:grid;grid-template-columns:22px 1fr 62px;gap:6px;align-items:center;
            font-size:11px;padding:3px 4px;border-radius:4px;cursor:pointer}
.rail .srow:hover{background:var(--paper-2)}
.rail .srow.on{background:var(--signal-soft)}
.rail .srow .b{height:9px;background:var(--paper-2);border-radius:2px;overflow:hidden}
.rail .srow .b i{display:block;height:100%;background:var(--signal)}
.rail .srow .v{text-align:right;font-family:var(--mono);font-size:10px;color:var(--ink-2)}
.rail hr{border:0;border-top:1px solid var(--line);margin:12px 0}

/* ---- H：顶部流程条 ---- */
.flow{position:sticky;top:52px;z-index:20;background:color-mix(in srgb,var(--paper) 95%,transparent);
      backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:10px 0 9px;margin-bottom:18px}
.flow .row{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;max-width:1020px}
.flow .st{text-align:left;padding:5px 7px;border-radius:6px;border:1px solid transparent;cursor:pointer}
.flow .st:hover{border-color:var(--line-2);background:var(--card)}
.flow .st.on{border-color:var(--signal);background:var(--signal-soft)}
.flow .st .t{display:flex;align-items:baseline;gap:5px;font-size:11px;color:var(--ink-2)}
.flow .st .t b{font-family:var(--serif);font-size:14px;color:var(--ink)}
.flow .st .b{height:6px;background:var(--paper-2);border-radius:2px;margin:4px 0 3px;overflow:hidden}
.flow .st .b i{display:block;height:100%;background:var(--signal)}
.flow .st .v{font-family:var(--mono);font-size:9.5px;color:var(--ink-3);display:flex;justify-content:space-between}
.flow .sum{display:flex;gap:16px;align-items:center;padding-top:8px;font-size:11px;color:var(--ink-2);max-width:1020px}
.flow .sum b{font-family:var(--serif);font-size:13px;color:var(--ink)}

/* ---- G：矩阵 ---- */
.G table{width:100%;border-collapse:collapse}
.G th{text-align:left;font-weight:500;font-size:10px;letter-spacing:.1em;text-transform:uppercase;
      color:var(--ink-3);padding:0 8px 8px;border-bottom:1px solid var(--line-2)}
.G td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle;font-size:12.5px}
.G tr.sum td{background:var(--paper-2);font-size:12px;color:var(--ink-2)}
.G .c{text-align:right;font-family:var(--mono);font-size:11.5px}
.G .nm{font-size:13px}
.G details summary{list-style:none;cursor:pointer}
.G details summary::-webkit-details-marker{display:none}
.G .rowx{display:grid;grid-template-columns:24px 1fr;gap:10px;padding:14px 0 4px}
.G .rowx .n{font-family:var(--serif);font-size:18px;color:var(--ink-3)}
.G .bar{height:8px;background:var(--paper-2);border-radius:2px;overflow:hidden;width:74px;display:inline-block;vertical-align:middle}
.G .bar i{display:block;height:100%;background:var(--signal)}

/* ---- 指标小组件 ---- */
.mini{display:grid;grid-template-columns:1fr auto;gap:6px;font-size:11.5px;padding:5px 0;border-bottom:1px solid var(--line)}
.mini:last-child{border-bottom:0}
.mini .v{font-family:var(--mono);font-size:11px;color:var(--ink-2)}
.fn{display:grid;gap:2px}
.fn .fr{display:grid;grid-template-columns:54px 1fr 96px;gap:8px;align-items:center;font-size:11px}
.fn .fb{height:16px;background:var(--signal);border-radius:2px;display:flex;align-items:center;
        justify-content:flex-end;padding-right:5px;color:#fff;font-family:var(--mono);font-size:10px;min-width:20px}
.fn .fb.z{background:var(--line-2);color:var(--ink-2)}
.fn .fnn{font-size:10px;color:var(--ink-3);text-align:right}
</style>
</head>

<script>
const $ = (s,el=document)=>el.querySelector(s);
const num = n => (n ?? 0).toLocaleString('en-US');
const compact = n => n >= 1e8 ? (n/1e8).toFixed(2)+' 亿' : n >= 1e4 ? (n/1e4).toFixed(n>=1e6?0:1)+' 万' : num(n||0);
const dur = ms => ms >= 1000 ? (ms/1000).toFixed(ms>=10000?0:1)+'s' : Math.round(ms)+'ms';
function el(tag, attrs={}, kids=[]) {
  const n = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs)) {
    if (k==='class') n.className = v;
    else if (k==='html') n.innerHTML = v;
    else if (k==='style') n.setAttribute('style', v);
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else if (v!==null && v!==undefined && v!==false) n.setAttribute(k, v);
  }
  for (const c of [].concat(kids)) if (c!==null && c!==undefined && c!==false) n.append(c);
  return n;
}
const STEP_NAME = {1:'收集与路由',2:'键触发 + 背景',3:'候选加载与验证',4:'现场探询',5:'深度排查',6:'结论与沉淀'};
const STEP_SHORT = {1:'路由',2:'键触发',3:'候选验证',4:'探询',5:'深度排查',6:'结论'};

/* ---------- 数据索引 ---------- */
const D = window.DATA;
const costByStep = Object.fromEntries((D.step_cost||[]).map(r=>[r.step,r]));
const eventsByStep = {};
D.events.forEach(e => { (eventsByStep[e.step] = eventsByStep[e.step]||[]).push(e); });
const STEPS = [1,2,3,4,5,6];
const totals = (D.step_cost||[]).reduce((a,r)=>({ms:a.ms+r.ms, calls:a.calls+r.calls,
  tok:a.tok+r.tokens.uncached+r.tokens.cache_read+r.tokens.out}), {ms:0,calls:0,tok:0});
const worst = (D.step_cost||[]).slice().sort((a,b)=>b.ms-a.ms)[0] || {step:'—',ms:0};
// token 分项按诊断窗口汇总：单步窗口里的 usage 已按步落库，这里只是把各步加起来，
// 与会话全会话账（包含诊断之外的时间）区分开，避免两边对不上。
const WINDOW_TOK = (D.step_cost||[]).reduce((a,r)=>({
  cache_read:a.cache_read+(r.tokens.cache_read||0),
  uncached:a.uncached+(r.tokens.uncached||0),
  out:a.out+(r.tokens.out||0),
  cache_write:a.cache_write+(r.tokens.cache_write||0),
}), {cache_read:0,uncached:0,out:0,cache_write:0});
const HAS_WINDOW = (D.step_cost||[]).length > 0;

/* ---------- 事件卡：轨迹里的正文全部呈现 ---------- */
const ROLE = { user:'用户材料', agent:'诊断动作' };
function eventCard(ev) {
  const head = el('div', { class:'ev-h' }, [
    el('span', { class:'who' }, ROLE[ev.role] || ev.role),
    ev.action ? el('span', { class:'act' }, ev.action) : null,
    ev.outcome ? el('span', { class:'tag ' + (ev.outcome==='hit'?'ok':ev.outcome==='miss'?'warn':'mute') }, ev.outcome) : null,
    ev.result ? el('span', { class:'tag warn' }, ev.result) : null,
    ev.case ? el('span', { class:'mono', style:'font-size:10.5px;color:var(--ink-3)' }, ev.case) : null,
    ev.purpose ? el('span', { class:'tag mute' }, ev.purpose) : null,
  ]);
  const body = [];
  if (ev.content) body.push(el('p', { class:'q' }, ev.content));
  if (ev.output) body.push(el('p', {}, ev.output));
  if (ev.reason) body.push(el('div', { class:'reason' }, [el('b', {}, '决策依据'), el('span', {}, ev.reason)]));

  const chips = [];
  if (ev.workload_type) chips.push(`负载 ${ev.workload_type}（${ev.workload_type_source||'—'}）`);
  if (ev.branch) chips.push(`分支 ${ev.branch}`);
  if (ev.category) chips.push(`类别 ${ev.category}`);
  if (ev.routed) chips.push(`路由 ${ev.routed.join(' / ')}`);
  if (ev.namespaces) chips.push(`命名空间 ${ev.namespaces.join(', ')}`);
  if (ev.n_cases) chips.push(`类视图 ${ev.n_cases} 条`);
  if (ev.candidates) chips.push(`候选 ${ev.candidates.join(', ')}`);
  if (ev.considered_candidates) chips.push(`看过 ${ev.considered_candidates.join(', ')}`);
  if (ev.excluded_cases) chips.push(`排除 ${ev.excluded_cases.join(', ')}`);
  if (ev.ref_ids) chips.push(`词条 ${ev.ref_ids.join(', ')}`);
  if (ev.report_file) chips.push(`报告 ${ev.report_file}`);
  if (ev.sediment_candidates) chips.push(`沉淀候选 ${ev.sediment_candidates} 条`);
  if (ev.steps_executed) chips.push(`走了第 ${ev.steps_executed.join('、')} 步`);
  if (ev.branch_taken) chips.push(`分支 ${ev.branch_taken}`);
  if (ev.gap) chips.push(`缺口 ${ev.gap}`);
  if (chips.length) body.push(el('div', { style:'display:flex;gap:6px;flex-wrap:wrap;margin:6px 0' },
    chips.map(c=>el('span', { class:'tag mute' }, c))));

  if (ev.tool_calls) body.push(el('ul', { class:'tc' }, ev.tool_calls.map(t=>el('li', {}, t))));

  if (ev.evidence) {
    const e = ev.evidence, kids = [];
    if (e.inline) kids.push(el('div', { class:'k' }, '原文要点'), el('p', { style:'margin:2px 0 0' }, e.inline));
    if (e.files) kids.push(el('div', { class:'k' }, '落盘证据'), el('ul', {}, e.files.map(f=>el('li', { class:'mono' }, f))));
    if (e.sources) kids.push(el('div', { class:'k' }, '来源'), el('ul', {}, e.sources.map(f=>el('li', { class:'mono' }, f))));
    if (e.missing) kids.push(el('div', { class:'k' }, '缺什么'), el('p', { style:'margin:2px 0 0' }, e.missing));
    body.push(el('details', {}, [el('summary', {}, '证据与来源'), el('div', { class:'evd' }, kids)]));
  }
  return el('article', { class:'ev ' + (ev.role || 'agent') }, [head, ...body]);
}

/* ---------- 步块 ---------- */
function stepBlock(n, opts={}) {
  const c = costByStep[n];
  const evs = eventsByStep[n] || [];
  const maxMs = Math.max(...(D.step_cost||[]).map(r=>r.ms), 1);
  return el('section', { class:'step', id:'step-'+n }, [
    el('div', { class:'step-h' }, [
      el('span', { class:'n num' }, String(n)),
      el('span', { class:'nm' }, STEP_NAME[n]),
      el('span', { class:'tag ' + (evs.length?'mute':'warn') }, evs.length ? `${evs.length} 个事件` : '轨迹里没有这一步'),
      c ? el('span', { class:'cost' }, [
        el('span', { class:'cb' }, el('i', { style:`width:${Math.max(2,c.ms/maxMs*100)}%` })),
        el('span', {}, dur(c.ms)),
        el('span', {}, `${c.calls} 次调用`),
        el('span', {}, `${compact(c.tokens.uncached+c.tokens.cache_read+c.tokens.out)} tok`),
      ]) : el('span', { class:'cost hint' }, '本次没记'),
    ]),
    ...(evs.length ? evs.map(eventCard) : [el('div', { class:'hint', style:'padding:6px 0' },
      opts.gapText || '这一步在轨迹里没有事件。不补：虚线节点与空段落就是它的真实状态。')]),
  ]);
}

/* ---------- 指标小组件 ---------- */
function railMetrics(highlightStep) {
  const maxMs = Math.max(...(D.step_cost||[]).map(r=>r.ms), 1);
  return [
    el('h3', {}, '本单读数'),
    el('div', { class:'kpi' }, [
      el('div', {}, [el('div',{class:'k'},'工具耗时'), el('div',{class:'v num'}, dur(totals.ms))]),
      el('div', {}, [el('div',{class:'k'},'调用'), el('div',{class:'v num'}, String(totals.calls))]),
      el('div', {}, [el('div',{class:'k'},'token'), el('div',{class:'v num',html:compact(totals.tok)})]),
      el('div', {}, [el('div',{class:'k'},'步'), el('div',{class:'v num'}, `${D.step_cost?D.step_cost.length:0}/6`)]),
    ]),
    el('hr'),
    el('h3', {}, '每步成本'),
    ...(D.step_cost||[]).map(r=>el('div', {
      class:'srow' + (r.step===highlightStep?' on':''),
      onclick:()=>{ document.getElementById('step-'+r.step)?.scrollIntoView({behavior:'smooth',block:'start'}); },
    }, [
      el('span', { class:'num', style:'font-size:11px;color:var(--ink-3)' }, String(r.step)),
      el('span', { class:'b' }, el('i', { style:`width:${Math.max(2,r.ms/maxMs*100)}%` })),
      el('span', { class:'v' }, dur(r.ms)),
    ])),
    el('hr'),
    el('h3', {}, '检索走向'),
    el('div', { class:'fn' }, [
      fnRow('类视图', D.retrieval.load_index_cases||0, D.retrieval.load_index_cases||1, String(D.retrieval.load_index_cases||0)),
      fnRow('进候选', (D.retrieval.candidates||[]).length, D.retrieval.load_index_cases||1, String((D.retrieval.candidates||[]).length)),
      fnRow('命中', 0, D.retrieval.load_index_cases||1, '0', true),
    ]),
    el('hr'),
    el('h3', {}, HAS_WINDOW ? 'token · 诊断窗口内' : 'token · 全会话'),
    el('div', { class:'mini' }, [el('span',{class:'hint'},'缓存读'), el('span',{class:'v'},compact(HAS_WINDOW?WINDOW_TOK.cache_read:D.tokens.cache_read))]),
    el('div', { class:'mini' }, [el('span',{class:'hint'},'未缓存输入'), el('span',{class:'v'},compact(HAS_WINDOW?WINDOW_TOK.uncached:D.tokens.uncached))]),
    el('div', { class:'mini' }, [el('span',{class:'hint'},'输出'), el('span',{class:'v'},compact(HAS_WINDOW?WINDOW_TOK.out:D.tokens.out))]),
  ];
}
function fnRow(label, v, max, text, zero) {
  return el('div', { class:'fr' }, [
    el('span', { class:'hint' }, label),
    el('div', { class:'fb' + (zero?' z':''), style:`width:${Math.max(v/max*100, 4)}%` }, text),
    el('span', { class:'fnn' }, ''),
  ]);
}

/* ---------- E：文档脊柱 ---------- */
function schemeE() {
  const maxMs = Math.max(...(D.step_cost||[]).map(r=>r.ms), 1);
  const spine = el('div', { class:'spine' }, STEPS.map(n=>{
    const c = costByStep[n];
    // 每一步是独立的一行，脊柱节点就该在这一行的顶部——不做跨行的比例定位（那会造成假的连续刻度）
    const seg = el('div', { class:'gutter' }, el('i', { style:'top:5px' }));
    return el('div', { style:'display:contents' }, [seg, el('div', {}, [stepBlock(n)])]);
  }));
  return el('div', { class:'E' }, [
    el('div', { style:'display:flex;gap:14px;align-items:baseline;margin-bottom:14px;flex-wrap:wrap' }, [
      el('div', { style:'font-family:var(--mono);font-size:12px' }, D.session),
      el('span', { class:'tag sig' }, (D.meta.feedback||{}).outcome || 'pending'),
      el('span', { class:'hint', html:`合计 <b class="num">${dur(totals.ms)}</b> · ${compact(totals.tok)} tok · 最贵是步 ${worst.step}` }),
    ]),
    spine,
  ]);
}

/* ---------- F：正文 + 右侧指标栏（滚动联动） ---------- */
function schemeF() {
  const rail = el('div', { class:'rail', id:'rail' }, railMetrics(null));
  const body = el('div', { class:'Fbody' }, STEPS.map(n=>stepBlock(n)));
  const wrap = el('div', { class:'F' }, [body, rail]);
  // 滚动联动：哪个步块在当前视窗，右栏就高亮哪一行
  const sync = new IntersectionObserver(entries=>{
    entries.forEach(e=>{
      if (!e.isIntersecting) return;
      const n = +e.target.id.replace('step-','');
      const r = $('#rail'); if (!r) return;
      const rows = r.querySelectorAll('.srow');
      r.querySelectorAll('.srow').forEach((row,i)=>{
        row.classList.toggle('on', (D.step_cost||[])[i] && (D.step_cost||[])[i].step === n);
      });
    });
  }, { rootMargin:'-30% 0px -60% 0px' });
  requestAnimationFrame(()=>{ wrap.querySelectorAll('.step').forEach(s=>sync.observe(s)); });
  return wrap;
}

/* ---------- G：步矩阵 + 展开 ---------- */
function schemeG() {
  const maxMs = Math.max(...(D.step_cost||[]).map(r=>r.ms), 1);
  const rows = STEPS.map(n=>{
    const c = costByStep[n], evs = eventsByStep[n] || [];
    const acts = [...new Set(evs.map(e=>e.action).filter(Boolean))];
    return el('tbody', {}, [
      el('tr', {}, [
        el('td', { class:'num', style:'font-size:15px;width:26px' }, String(n)),
        el('td', {}, [el('div', { class:'nm' }, STEP_NAME[n]), el('div', { class:'hint' }, evs.length ? `${evs.length} 个事件` : '无事件')]),
        el('td', { style:'width:120px' }, el('div', { class:'bar' }, el('i', { style:`width:${c?Math.max(2,c.ms/maxMs*100):0}%` }))),
        el('td', { class:'c', style:'width:70px' }, c ? dur(c.ms) : '—'),
        el('td', { class:'c', style:'width:86px' }, c ? compact(c.tokens.uncached+c.tokens.cache_read+c.tokens.out)+' tok' : '—'),
        el('td', { class:'c', style:'width:64px' }, c ? c.calls+' 次' : '—'),
        el('td', { style:'width:180px' }, el('div', { style:'display:flex;gap:4px;flex-wrap:wrap' },
          acts.map(a=>el('span', { class:'tag mute' }, a)))),
        el('td', { style:'width:30px;text-align:right' }, el('span', { class:'chev', style:'display:inline-block;color:var(--ink-3);transition:transform .2s' }, '›')),
      ]),
      el('tr', {}, el('td', { colspan:'8', style:'padding:0;border-bottom:1px solid var(--line)' },
        el('details', { open: (n === worst.step) ? '' : null }, [
          el('summary', { style:'height:0;overflow:hidden' }, '展开',
          ),
          el('div', { class:'rowx', style:'padding-left:8px;padding-right:8px' }, [
            el('div', {}),
            el('div', {}, evs.length ? evs.map(eventCard) : [el('div',{class:'hint'},'这一步在轨迹里没有事件。')]),
          ]),
        ]))),
    ]);
  });
  const box = el('div', { class:'G' });
  const table = el('table', {}, [
    el('thead', {}, el('tr', {}, [
      el('th', {}, '#'), el('th', {}, '步'), el('th', {}, '相对耗时'),
      el('th', { class:'c' }, '耗时'), el('th', { class:'c' }, 'token'),
      el('th', { class:'c' }, '调用'), el('th', {}, '动作'), el('th', { style:'width:30px' }),
    ])),
    ...rows,
  ]);
  // 让每个 <details> 的 summary 占据整行点击：用 JS 绑定行点击
  table.querySelectorAll('tbody').forEach(tb=>{
    const [r1, r2] = tb.querySelectorAll('tr');
    const det = r2.querySelector('details');
    r1.style.cursor = 'pointer';
    const chev = r1.querySelector('.chev');
    r1.addEventListener('click', ()=>{
      det.open = !det.open;
      if (chev) chev.style.transform = det.open ? 'rotate(90deg)' : '';
      if (det.open) det.scrollIntoView({block:'nearest'});
    });
  });
  box.append(
    el('div', { style:'display:flex;gap:18px;align-items:baseline;margin-bottom:12px;flex-wrap:wrap' }, [
      el('span', { class:'mono', style:'font-size:12px' }, D.session),
      el('span', { class:'hint', html:`合计 <b class="num">${dur(totals.ms)}</b> · ${compact(totals.tok)} tok · 最贵是步 ${worst.step}（${dur(worst.ms)}）` }),
      el('span', { class:'hint' }, '点任意一行展开该步的完整轨迹内容'),
    ]),
    table,
  );
  return box;
}

/* ---------- H：顶部流程条 + 正文 ---------- */
function schemeH() {
  const maxMs = Math.max(...(D.step_cost||[]).map(r=>r.ms), 1);
  const flow = el('div', { class:'flow' });
  const row = el('div', { class:'row' });
  const steps = STEPS.map(n=>{
    const c = costByStep[n], evs = eventsByStep[n]||[];
    return el('button', { class:'st', 'data-n':n, onclick:()=>{
      document.getElementById('step-'+n)?.scrollIntoView({behavior:'smooth',block:'start'});
    }}, [
      el('div', { class:'t' }, [el('b', {}, String(n)), el('span', {}, STEP_SHORT[n])]),
      el('div', { class:'b' }, el('i', { style:`width:${c?Math.max(2,c.ms/maxMs*100):0}%` })),
      el('div', { class:'v' }, [el('span', {}, c?dur(c.ms):'无'), el('span', {}, c?`${c.calls} 次`:'—')]),
    ]);
  });
  row.append(...steps);
  flow.append(row, el('div', { class:'sum' }, [
    el('span', { html:`合计 <b>${dur(totals.ms)}</b> 工具耗时` }),
    el('span', { html:`<b>${compact(totals.tok)}</b> token` }),
    el('span', { html:`<b>${totals.calls}</b> 次调用` }),
    el('span', { class:'hint', html:`检索：类视图 ${D.retrieval.load_index_cases||0} 条 → 候选 ${(D.retrieval.candidates||[]).length} 条 → 命中 0` }),
    el('span', { style:'margin-left:auto' }, el('span', { class:'tag sig' }, (D.meta.feedback||{}).outcome||'pending')),
  ]));
  const body = el('div', { style:'max-width:900px' }, STEPS.map(n=>stepBlock(n)));
  // 滚动联动高亮流程条
  const io = new IntersectionObserver(es=>{
    es.forEach(e=>{
      if (!e.isIntersecting) return;
      const n = e.target.id.replace('step-','');
      flow.querySelectorAll('.st').forEach(b=>b.classList.toggle('on', b.dataset.n === n));
    });
  }, { rootMargin:'-25% 0px -65% 0px' });
  requestAnimationFrame(()=>body.querySelectorAll('.step').forEach(s=>io.observe(s)));
  return el('div', {}, [flow, body]);
}

/* ---------- 挂载 ---------- */
const SCHEMES = [
  ['E','文档脊柱'],
  ['F','正文 + 指标栏'],
  ['G','步矩阵 + 展开'],
  ['H','流程条 + 正文'],
];
const NOTES = {
  E:'方案 E · 轨迹按步排成一篇文档，左侧一条脊柱标出每步的耗时，步头自带耗时/token/调用数。信息量与现在的轨迹渲染一致，指标贴着它所属的那一步——不用来回跳。',
  F:'方案 F · 正文完全不动（就是现在的轨迹渲染），右栏常驻本单读数：每步成本、检索走向、token。滚动正文时右栏跟着高亮当前步，两边靠这一步对齐。',
  G:'方案 G · 先给一张「步 × 读数」矩阵（一眼看出哪一步贵、哪一步动作多），点行展开该步的完整轨迹内容。适合先判断该裁哪一步，再进去读细节。',
  H:'方案 H · 顶部一条流程条 = 导航 + 指标（每步耗时条、调用数、合计、检索一行），正文照旧按步排。往下读时流程条跟着高亮，随时能跳；不占右栏宽度。',
};
const state = { scheme:'E' };
(() => {
  const h = location.hash.replace('#','');
  const m = /([EFGH])/.exec(h); if (m) state.scheme = m[1];
  if (/dark/.test(h)) document.documentElement.setAttribute('data-theme','dark');
})();
$('#seg').append(...SCHEMES.map(([k,l])=>el('button',{'data-k':k,'aria-pressed':String(state.scheme===k),onclick:()=>{state.scheme=k;render();}},k+' · '+l)));
$('#theme').onclick=()=>{const c=document.documentElement.getAttribute('data-theme');document.documentElement.setAttribute('data-theme',c==='dark'?'light':'dark');};

function render() {
  [...$('#seg').children].forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.k===state.scheme)));
  $('#note').innerHTML = NOTES[state.scheme];
  const stage = $('#stage'); stage.innerHTML='';
  stage.append({E:schemeE,F:schemeF,G:schemeG,H:schemeH}[state.scheme]());
  window.scrollTo(0,0);
}
render();
</script>
</body>
</html>
