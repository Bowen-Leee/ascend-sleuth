<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>诊断面板 v2 · 更少的字，更多的图</title>
<style>
:root{
  --paper:#f7f4ee; --paper-2:#f1ede4; --card:#fbf9f5;
  --ink:#1a1713; --ink-2:#5d564b; --ink-3:#8d8577;
  --line:#e2dccd; --line-2:#cfc7b4;
  --signal:#b3401f; --signal-soft:rgba(179,64,31,.08);
  --good:#2f6f4a; --warn:#8a6410; --bad:#a32b22; --mute:#7c7568;
  --serif:"Charter","Iowan Old Style","Songti SC",Georgia,serif;
  --sans:"Avenir Next","PingFang SC","Hiragino Sans GB","Helvetica Neue",sans-serif;
  --mono:"SF Mono",ui-monospace,Menlo,monospace;
}
html[data-theme=dark]{
  --paper:#14130f; --paper-2:#1a1814; --card:#1d1b16;
  --ink:#f2eee4; --ink-2:#b3ac9d; --ink-3:#7e776a;
  --line:#2b2822; --line-2:#3b372e;
  --signal:#e0703f; --signal-soft:rgba(224,112,63,.12);
  --good:#67b68c; --warn:#d6a44a; --bad:#e06a5e; --mute:#8b8477;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.55 var(--sans);-webkit-font-smoothing:antialiased;padding:26px 30px 90px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
h1,h2,h3{margin:0;font-weight:600}
.num{font-family:var(--serif);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.mono{font-family:var(--mono);font-size:.92em}
.hint{font-size:11.5px;color:var(--ink-3)}
.tag{display:inline-block;font-size:10px;letter-spacing:.04em;padding:1px 5px;border-radius:4px;border:1px solid currentColor;white-space:nowrap}
.tag.mute{color:var(--mute)}.tag.ok{color:var(--good)}.tag.warn{color:var(--warn)}.tag.sig{color:var(--signal)}
.btn{font-size:11.5px;border:1px solid var(--line-2);border-radius:6px;padding:3px 9px;color:var(--ink-2);background:var(--card);white-space:nowrap}
.btn:hover{border-color:var(--signal);color:var(--signal)}
.btn.solid{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.sm{font-size:10.5px;padding:2px 7px}
.head{max-width:1240px;margin:0 auto 14px;display:flex;align-items:baseline;gap:12px}
.head h1{font-family:var(--serif);font-size:18px}
.head .hint{max-width:70ch;line-height:1.5}
.wrap{max-width:1240px;margin:0 auto}

/* ================= 收起态：一行表格 ================= */
.tbl{width:100%;border-collapse:collapse}
.thead{display:grid;grid-template-columns:78px minmax(0,1fr) 132px 84px 92px 74px 74px 30px;
       gap:10px;padding:0 10px 7px;border-bottom:1px solid var(--line-2)}
.thead span{font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3)}
.thead span.r{text-align:right}
.row{border-bottom:1px solid var(--line)}
.row:hover{background:var(--paper-2)}
.row.on{background:var(--signal-soft);border-bottom:0}
.rowin{display:grid;grid-template-columns:78px minmax(0,1fr) 132px 84px 92px 74px 74px 30px;
       gap:10px;align-items:center;padding:9px 10px;cursor:pointer}
.st{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--ink-2)}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block}
.dot.run{background:var(--signal);box-shadow:0 0 0 3px var(--signal-soft)}
.dot.ok{background:var(--good)}.dot.warn{background:var(--warn)}.dot.mute{background:var(--mute)}
.rid{font-family:var(--mono);font-size:11.5px;display:flex;gap:5px;min-width:0}
.rid .d{color:var(--ink-3);flex:0 0 auto}
.rid .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rid+.why{font-size:10.5px;color:var(--ink-3);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc{font-size:10.5px;color:var(--ink-3);white-space:nowrap}
.small{font-family:var(--mono);font-size:10.5px;color:var(--ink-2);text-align:right;white-space:nowrap}
.spark{display:flex;align-items:flex-end;gap:2px;height:16px;justify-content:flex-end}
.spark i{width:5px;background:var(--signal);opacity:.8;border-radius:1px}
.spark i.z{background:var(--line-2);opacity:1;height:2px!important}
.chev{color:var(--ink-3);text-align:right;transition:transform .18s}
.row.on .chev{transform:rotate(90deg);color:var(--signal)}

/* ================= 展开态 ================= */
.exp{padding:14px 12px 18px;background:var(--card);border-top:1px solid var(--line)}
.band{display:grid;grid-template-columns:1.15fr 1fr 1fr;gap:22px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.band h3{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin-bottom:8px}
.band h3 b{color:var(--ink);font-weight:500;letter-spacing:0;text-transform:none;font-size:11.5px}

/* 六步柱 */
.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;align-items:end;height:86px}
.steps .c{display:flex;flex-direction:column;justify-content:flex-end;height:100%;gap:4px}
.steps .c .bar{background:var(--paper-2);border-radius:3px;height:100%;display:flex;align-items:flex-end;overflow:hidden}
.steps .c .bar i{display:block;width:100%;background:var(--signal);border-radius:3px}
.steps .c.void .bar{background:transparent;border:1px dashed var(--line-2)}
.lab{display:flex;justify-content:space-between;font-size:9.5px;color:var(--ink-3);font-family:var(--mono)}
.lab b{color:var(--ink);font-family:var(--serif);font-size:10.5px}

/* 检索漏斗 */
.fune{display:grid;gap:4px;margin-top:2px}
.fune .fr{display:grid;grid-template-columns:52px 1fr 40px;gap:8px;align-items:center;font-size:10.5px}
.fune .fb{height:18px;background:var(--signal);border-radius:2px;opacity:.9}
.fune .fb.z{background:var(--line-2)}
.fune .n{font-family:var(--mono);font-size:10.5px;text-align:right;color:var(--ink-2)}
.miss{margin-top:8px;font-size:10.5px;color:var(--ink-3);line-height:1.5}

/* token 条 */
.tok{display:flex;height:18px;border-radius:2px;overflow:hidden;margin-top:2px}
.tok i{display:block;height:100%}
.toklab{display:grid;gap:3px;margin-top:8px}
.toklab div{display:flex;justify-content:space-between;font-size:10.5px;color:var(--ink-2)}
.toklab b{font-family:var(--mono);font-weight:500;color:var(--ink)}

.body{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:24px;padding-top:14px;align-items:start}
.left{min-width:0}
.right{position:sticky;top:8px;display:grid;gap:10px}

/* 正文：更紧 */
.sec{margin-bottom:14px}
.sec>h4{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin:0 0 7px;display:flex;gap:8px;align-items:center}
.sec>h4 .more{margin-left:auto;font-size:10.5px;color:var(--ink-2);border:1px solid var(--line-2);border-radius:999px;padding:0 8px}
.bg{font-size:12.5px;line-height:1.65;color:var(--ink-2)}
.bg.clip{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.concl2{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.concl2>div{background:var(--card);padding:8px 10px}
.concl2 .k{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-bottom:2px}
.concl2 .v{font-size:12px;line-height:1.35}

/* 轨迹：默认 3 步，事件压成两行 */
.ev{border-left:2px solid var(--line);padding:0 0 0 10px;margin:8px 0}
.ev.agent{border-left-color:var(--signal)}
.evh{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;font-size:11px}
.evh .who{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.evh .act{font-family:var(--mono);font-size:10.5px;color:var(--ink-2);background:var(--paper-2);border:1px solid var(--line);border-radius:3px;padding:0 4px}
.ev p{margin:2px 0 0;font-size:12.5px;line-height:1.6;max-width:76ch;
      display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ev p.open{-webkit-line-clamp:unset;display:block}
.ev .more{font-size:10.5px;color:var(--ink-3);margin-top:2px}
.stephead{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--line);margin-top:10px}
.stephead .n{font-family:var(--serif);font-size:13px;color:var(--ink-3);width:16px}
.stephead .nm{font-size:11.5px}
.stephead .cost{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--ink-3);display:flex;gap:8px;align-items:center}
.stephead .cost .cb{width:52px;height:5px;background:var(--paper-2);border-radius:2px;overflow:hidden}
.stephead .cost .cb i{display:block;height:100%;background:var(--signal)}

/* 右栏 */
.card{border:1px solid var(--line);border-radius:8px;padding:9px 10px;background:var(--card)}
.card h5{margin:0 0 6px;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.card .row{display:flex;gap:4px;flex-wrap:wrap}
.kv{display:flex;justify-content:space-between;font-size:10.5px;color:var(--ink-2);padding:1px 0}
.kv b{font-family:var(--mono);font-weight:500;color:var(--ink)}
.gap{border:1px dashed var(--line-2);border-radius:8px;padding:8px 10px;font-size:11px;color:var(--ink-2);display:flex;justify-content:space-between;align-items:center}
.gap b{font-family:var(--mono);color:var(--ink)}
</style>
</head>
<body>
<div class="head">
  <h1>诊断面板 v2</h1>
  <span class="hint">三处改动：① 收起态做成真正的表格行（一行读完，带每步耗时的火花条）；② 展开态把「本次没记」收成右栏一个缺口徽标；③ 指标用三张图（六步柱 / 检索漏斗 / token 条），轨迹默认只铺 3 步、事件压成两行。</span>
</div>
<div class="wrap">
  <div class="thead">
    <span>状态</span><span>会话</span><span>平台 · 类别</span><span>步 / 动作</span><span>每步耗时</span>
    <span class="r">工具耗时</span><span class="r">token</span><span></span>
  </div>
  <div id="rows"></div>
</div>

<script>
const STEPS = [
  {n:1, short:'路由', name:'收集与路由', ms:2537, calls:1, tok:178078},
  {n:2, short:'键触发', name:'键触发 + 背景', ms:266, calls:1, tok:178824},
  {n:3, short:'候选验证', name:'候选加载与验证', ms:2132, calls:2, tok:361756},
  {n:4, short:'探询', name:'现场探询', ms:null, calls:0, tok:null},
  {n:5, short:'深度排查', name:'深度排查', ms:5044, calls:4, tok:553405},
  {n:6, short:'结论', name:'结论与沉淀', ms:0, calls:1, tok:187614},
];
const RUNS = [
  { id:'2026-10-18-18178-eplb-hixl-103900', status:'run', st:'运行中', platform:'A3-910C', cat:'interrupt',
    steps:6, actions:11, ms:10000, tok:1460000, stepms:[2537,266,2132,0,5044,0], excluded:2, sediment:2,
    why:'EPLB 初始化抛 HIXL 103900：按分配器段注册在 expandable_segments 下失效' },
  { id:'2026-10-17-17642-dsv4-indexer-dtype', status:'run', st:'运行中', platform:'A2-910B', cat:'interrupt',
    steps:6, actions:16, ms:0, tok:0, stepms:[], excluded:3, sediment:2,
    why:'DeepSeek-V4 默认配置在 A2 上启动崩于 aclnnScatterNdUpdateSk（EZ1001 dtype 不一致）' },
  { id:'2026-10-13-18551-310p-nz-offload', status:'run', st:'运行中', platform:'310P', cat:'interrupt',
    steps:8, actions:13, ms:0, tok:0, stepms:[], excluded:2, sediment:4,
    why:'310P + prefetch offload 首次前向报 x1 format should be ND, actual FRACTAL_NZ' },
  { id:'2026-09-18-dsv4flash-dspark-indexcheck', status:'ok', st:'已闭环', platform:'A3-910C', cat:'interrupt',
    steps:27, actions:32, ms:0, tok:0, stepms:[], excluded:4, sediment:2,
    why:'DSV4-Flash + dspark 的 IndexCheck 在 device 侧失败' },
];

const dur = ms => ms === null ? '—' : ms >= 1000 ? (ms/1000).toFixed(1)+'s' : ms+'ms';
const compact = n => !n ? '—' : n >= 1e8 ? (n/1e8).toFixed(2)+' 亿' : n >= 1e4 ? (n/1e4).toFixed(1)+' 万' : String(n);
const el = (t, a = {}, k = []) => {
  const n = document.createElement(t);
  for (const [x, v] of Object.entries(a)) {
    if (x === 'class') n.className = v; else if (x === 'html') n.innerHTML = v;
    else if (v !== null && v !== undefined && v !== false) n.setAttribute(x, v);
  }
  for (const c of [].concat(k)) if (c !== null && c !== undefined && c !== false) n.append(c);
  return n;
};

let openId = RUNS[0].id;

function spark(vals) {
  if (!vals || !vals.length) return el('span', { class: 'hint', style: 'font-size:10px' }, '—');
  const max = Math.max(...vals, 1);
  return el('div', { class: 'spark' }, vals.map(v => el('i', { class: v ? '' : 'z', style: `height:${v ? Math.max(2, Math.round(v/max*16)) : 2}px` })));
}

function band() {
  const maxMs = Math.max(...STEPS.map(s => s.ms || 0), 1);
  const total = STEPS.reduce((a, s) => a + (s.ms || 0), 0);
  const steps = el('div', { class: 'steps' }, STEPS.map(s => {
    const h = s.ms ? Math.max(4, Math.round(s.ms / maxMs * 100)) : 0;
    return el('div', { class: 'c' + (s.ms === null ? ' void' : '') , title: `${s.name} ${dur(s.ms)}` }, [
      el('div', { class: 'bar' }, s.ms ? el('i', { style: `height:${h}%` }) : null),
      el('div', { class: 'lab' }, [el('span', {}, String(s.n)), el('b', {}, dur(s.ms))]),
      el('div', { class: 'lab', style: 'justify-content:flex-start' }, el('span', {}, s.short)),
    ]);
  }));
  const funnel = el('div', { class: 'fune' }, [
    el('div', { class: 'fr' }, [el('span', { class: 'hint' }, '类视图'), el('div', { class: 'fb', style: 'width:100%' }), el('span', { class: 'n' }, '93')]),
    el('div', { class: 'fr' }, [el('span', { class: 'hint' }, '进候选'), el('div', { class: 'fb', style: 'width:6px' }), el('span', { class: 'n' }, '2')]),
    el('div', { class: 'fr' }, [el('span', { class: 'hint' }, '命中'), el('div', { class: 'fb z', style: 'width:6px' }), el('span', { class: 'n' }, '0')]),
  ]);
  const tok = { cr: 1287808, un: 164430, out: 7439 };
  const tokSum = tok.cr + tok.un + tok.out;
  const seg = (v, c) => el('i', { style: `width:${v / tokSum * 100}%;background:${c}` });
  return el('div', { class: 'band' }, [
    el('div', {}, [el('h3', {}, ['每步耗时 ', el('b', {}, '合计 ' + dur(total) + ' · 最贵步 5')]), steps]),
    el('div', {}, [el('h3', {}, ['检索 ', el('b', {}, '93 → 2 → 0')]), funnel,
      el('div', { class: 'miss' }, '两条候选的判别式都没命中（10998 / 13934）→ 转流程深挖')]),
    el('div', {}, [el('h3', {}, ['token ', el('b', {}, compact(tokSum))]),
      el('div', { class: 'tok' }, [seg(tok.cr, 'var(--signal)'), seg(tok.un, '#c9764f'), seg(tok.out, '#a98f6a')]),
      el('div', { class: 'toklab' }, [
        el('div', {}, [el('span', {}, '缓存读'), el('b', {}, compact(tok.cr))]),
        el('div', {}, [el('span', {}, '未缓存'), el('b', {}, compact(tok.un))]),
        el('div', {}, [el('span', {}, '输出'), el('b', {}, compact(tok.out))]),
      ])]),
  ]);
}

function evCard(role, act, text, tail) {
  const p = el('p', {}, text);
  const more = el('div', { class: 'more' }, '展开依据与证据 ▸');
  more.addEventListener('click', e => { e.stopPropagation(); p.classList.toggle('open'); more.textContent = p.classList.contains('open') ? '收起 ▴' : '展开依据与证据 ▸'; });
  return el('article', { class: 'ev ' + role }, [
    el('div', { class: 'evh' }, [el('span', { class: 'who' }, role === 'user' ? '用户材料' : '诊断动作'), act ? el('span', { class: 'act' }, act) : null, tail || null]),
    p, more,
  ]);
}

function expanded() {
  const body = el('div', { class: 'body' });
  const left = el('div', { class: 'left' });

  left.append(el('section', { class: 'sec' }, [
    el('h4', {}, ['问题背景', el('span', { class: 'more' }, '全文')]),
    el('div', { class: 'bg clip' }, '定位 vllm-ascend issue #18178：A3（910C）×8、vllm 0.30.0 + vllm-ascend 0.19.1rc2、CANN 9.2.0，开 EPLB + 投机解码（draft 模型）+ PYTORCH_NPU_ALLOC_CONF=expandable_segments:True 时，EPLB 初始化抛 HIXL EPLB register memory failed with status 103900，服务起不来。'),
  ]));
  left.append(el('section', { class: 'sec' }, [
    el('h4', {}, ['结论']),
    el('div', { class: 'concl2' }, [
      el('div', {}, [el('div', { class: 'k' }, '命中'), el('div', { class: 'v' }, '未命中 · 排除 2')]),
      el('div', {}, [el('div', { class: 'k' }, '沉淀'), el('div', { class: 'v num' }, '2 条候选')]),
      el('div', {}, [el('div', { class: 'k' }, '强度'), el('div', { class: 'v' }, '确定性')]),
      el('div', {}, [el('div', { class: 'k' }, '回报'), el('div', { class: 'v' }, 'pending')]),
    ]),
  ]));
  left.append(el('section', { class: 'sec' }, [
    el('h4', {}, ['轨迹', el('span', { class: 'more' }, '看全部 6 步')]),
    el('div', { class: 'stephead' }, [el('span', { class: 'n' }, '1'), el('span', { class: 'nm' }, '收集与路由'),
      el('span', { class: 'cost' }, [el('span', { class: 'cb' }, el('i', { style: 'width:50%' })), el('span', {}, '2.5s'), el('span', {}, '1 次')])]),
    evCard('user', null, '诊断这个上游 issue：https://github.com/vllm-project/vllm-ascend/issues/18178'),
    evCard('agent', 'triage', '推理侧启动失败（interrupt），负载类型 inference，路由 inference/vllm-ascend。', el('span', { class: 'tag mute' }, '分流')),
    el('div', { class: 'stephead' }, [el('span', { class: 'n' }, '2'), el('span', { class: 'nm' }, '键触发 + 背景'),
      el('span', { class: 'cost' }, [el('span', { class: 'cb' }, el('i', { style: 'width:5%' })), el('span', {}, '266ms'), el('span', {}, '1 次')])]),
    evCard('agent', 'reference_lookup', '103900 命中 HIXL 错误码表：PARAM_INVALID（参数错误，可恢复），解法是「基于日志排查错误原因——参数类问题先看调用入参」。', el('span', { class: 'tag ok' }, 'hit')),
    el('div', { class: 'stephead' }, [el('span', { class: 'n' }, '3'), el('span', { class: 'nm' }, '候选加载与验证'),
      el('span', { class: 'cost' }, [el('span', { class: 'cb' }, el('i', { style: 'width:42%' })), el('span', {}, '2.1s'), el('span', {}, '2 次')])]),
    evCard('agent', 'quickly_check', '10998 排除：primary `Failed to get N keys out of M ... error_codes=[-704]` 在原文上 0 命中；本案是注册失败，不是取块失败。', el('span', { class: 'tag warn' }, 'mismatch')),
  ]));
  left.append(el('div', { class: 'hint', style: 'margin-top:4px' }, '后面还有 3 步（深度排查 / 结论）——点上面的「看全部 6 步」展开。'));

  const right = el('div', { class: 'right' }, [
    el('div', { class: 'card' }, [
      el('h5', {}, '定位报告'),
      el('div', { class: 'row' }, [el('button', { class: 'btn solid sm' }, '在面板里读'), el('button', { class: 'btn sm' }, '复制全文'), el('button', { class: 'btn sm' }, '打开文件')]),
    ]),
    el('div', { class: 'card' }, [
      el('h5', {}, '指令'),
      el('div', { class: 'row' }, [el('button', { class: 'btn sm' }, '继续诊断'), el('button', { class: 'btn sm' }, '已解决'), el('button', { class: 'btn sm' }, '没解决')]),
    ]),
    el('div', { class: 'card' }, [
      el('h5', {}, '交接包'),
      el('div', { class: 'row' }, [el('button', { class: 'btn sm' }, '继续定位'), el('button', { class: 'btn sm' }, '导出交接包')]),
    ]),
    el('div', { class: 'card' }, [
      el('h5', {}, '会话'),
      el('div', { class: 'kv' }, [el('span', {}, '工具耗时'), el('b', {}, '10.0s')]),
      el('div', { class: 'kv' }, [el('span', {}, '调用'), el('b', {}, '526 次')]),
      el('div', { class: 'kv' }, [el('span', {}, '会话号'), el('b', {}, '…8f421f')]),
      el('div', { class: 'kv' }, [el('span', {}, 'kb_rev'), el('b', {}, '4a923cd')]),
    ]),
    el('button', { class: 'gap' }, [el('span', {}, '数据缺口'), el('b', {}, '8 项 ›')]),
  ]);
  body.append(left, right);
  return el('div', { class: 'exp' }, [band(), body]);
}

function rowHtml(r) {
  const tr = el('div', { class: 'row' + (r.id === openId ? ' on' : '') });
  const inner = el('div', { class: 'rowin' }, [
    el('span', { class: 'st' }, [el('span', { class: 'dot ' + r.status }), r.st]),
    el('div', {}, [el('div', { class: 'rid' }, [el('span', { class: 'd' }, r.id.slice(0, 10)), el('span', { class: 't' }, r.id.slice(11))]),
      el('div', { class: 'why' }, r.why)]),
    el('div', { class: 'pc' }, r.platform + ' · ' + r.cat),
    el('div', { class: 'small', style: 'text-align:left' }, r.steps + ' / ' + r.actions),
    spark(r.stepms),
    el('div', { class: 'small' }, r.ms ? dur(r.ms) : '—'),
    el('div', { class: 'small' }, compact(r.tok)),
    el('div', { class: 'chev' }, '›'),
  ]);
  inner.addEventListener('click', () => { openId = openId === r.id ? null : r.id; render(); });
  tr.append(inner);
  return tr;
}

function render() {
  const tb = document.getElementById('rows');
  tb.innerHTML = '';
  RUNS.forEach(r => {
    tb.append(rowHtml(r));
    if (r.id === openId) {
      tb.append(expanded());
    }
  });
}
render();
</script>
</body>
</html>
