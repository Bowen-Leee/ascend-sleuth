# 条目使用记录的源：一周一个文件，一次运行追加若干行，一行一条自包含记录。
#
# 谁写：scripts/trace_entry_activity.py（汇总：被选中/被加载/被排除、先验三态与消费点、工具分布）
#       scripts/settle_trace_feedback.py（结算：现场确认解决/自证解决/误诊）
#       scripts/migrate_confidence_baseline.py（搬运：案例文件里原有的累计值，kind: baseline）
# 谁读：scripts/build_entry_activity.py 聚合成 metrics/entry-activity/<部署>.yaml，读端只读生成物。
#
# 不要改已经写下的行：追加是唯一写动作。同一周多人各写各的行，配 merge=union（行级合并）两侧都留住。
# 行的唯一键是 (run, kind, id)；同一行被重复保留只算一次，键相同而内容不同的两行判重复（校验脚本报红）。
