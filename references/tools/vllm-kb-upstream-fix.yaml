id: vllm-kb-upstream-fix
type: tool
title: vllm_kb_fix 查一条 issue 的修复链路（vllm-kb 接入插件；issue→修复 PR→落地 release）
summary: vllm_kb_fix 用外部只读知识库追溯修复链路：一条 issue 对应哪个修复 PR、进了哪个 release、改了哪些符号；用来回答「升级到哪个版本能解」，结果只当线索，给「已修复」结论前仍要按行核对部署代码。

