content:
  tool_name: vllm_kb_fix（vllm-kb 接入插件的修复链工具；打 GET /graph/chain，target 里的 repo#编号 会转成 source_id）
  invocation: "工具参数 target（必填），格式 <仓库>#<编号>，如 vllm-ascend#8938。"
  output_meaning: >-
    返回该 issue 的修复 PR、这些 PR 落到哪些 release、以及涉及的主要符号。
    它回答的是「社区在哪个版本修了」，不回答「你的部署里有没有这个修复」。
  pitfalls:
    - 这是社区声称的链路，属线索级。上游有 PR、issue 已 closed，都不等于你的部署里有这个修复——PR 可能只进主干未 backport，镜像与 fork 不能按版本号推断。
    - 给「已修复 / 升级即可」结论前必须做落地实证：从 PR 取修复特征行，再用 vllm_kb_code（或本地源码）在部署那份代码里确认它在。核不到就写未修复或无法判定。
    - 服务不可达时返回 ok:false；记 skipped、回原路径，本单不再重试。
    - release tag 推断只对官方 tag 快照成立；镜像与 fork 必须换成在镜像代码里查。
  commands:
    chain: "target=vllm-ascend#8938——拿修复 PR 与落地版本"
